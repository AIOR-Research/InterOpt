[[hidden_slots]]
slot_id = "H1"
name = "start_end_location"
severity = "P2"
severity_reason = "Without this information, the agent can still formulate a correct TSP model for minimizing total travel distance, but they might not output the tour starting at location 1 as intended. The missing constraint is a reporting detail that does not affect the core optimization result."
problem_unit_id = "U5"
reference_acceptable_questions = ["Does the tour have to start and end at a specific location?", "Is location 1 the starting and ending point?"]
semantic_hit_rule = "The agent's question must inquire about the requirement for the tour to start and end at location 1, or generally ask if there is a specified depot location."
failure_modes = ["Assuming the tour can start and end at any location, and not specifying the start node constraint."]
simulator_answer = "Yes, the salesman needs to start and end his trip at location 1."

[[hidden_slots]]
slot_id = "H2"
name = "objective_minimize_distance"
severity = "P0"
severity_reason = "Without an objective, the mathematical program cannot be formulated, as there is no criterion to optimize. The problem would be unclear and the agent would have to guess the objective, which is a critical missing piece that makes modeling impossible."
problem_unit_id = "U6"
reference_acceptable_questions = ["What is the objective? Are we minimizing total distance, time, or cost?", "Do we want to minimize the total travel distance?"]
semantic_hit_rule = "The agent's question must ask about the optimization objective, specifically whether the goal is to minimize total distance or something else."
failure_modes = ["Assuming without clarification that the objective is to minimize distance, when it could be minimize time or cost."]
simulator_answer = "The aim is to minimize the total travel distance for the entire trip."

