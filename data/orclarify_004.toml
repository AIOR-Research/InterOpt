[metadata]
schema_version = "0.3"
benchmark = "OR-Clarify"
case_id = "orclarify_004"

[[problem_units]]
id = "U1"
kind = "context"
content = "I need help deciding how many cows, sheep, and chickens to raise for a farm."

[[problem_units]]
id = "U2"
kind = "data"
content = "Selling prices: cow $500, sheep $200, chicken $8."

[[problem_units]]
id = "U3"
kind = "data"
content = "Feed costs per animal: cow $100, sheep $80, chicken $5."

[[problem_units]]
id = "U4"
kind = "data"
content = "Manure production per animal per day: cow 10 units, sheep 5 units, chicken 3 units."

[[problem_units]]
id = "U5"
kind = "data"
content = "Manure handling capacity: 800 units per day."

[[problem_units]]
id = "U6"
kind = "data"
content = "Maximum number of chickens allowed: 50."

[[problem_units]]
id = "U7"
kind = "data"
content = "Minimum number of cows required: 10."

[[problem_units]]
id = "U8"
kind = "data"
content = "Minimum number of sheep required: 20."

[[problem_units]]
id = "U9"
kind = "data"
content = "Maximum total number of animals: 100."

[[problem_units]]
id = "U10"
kind = "constraint"
content = "Total manure produced per day cannot exceed 800 units."

[[problem_units]]
id = "U11"
kind = "constraint"
content = "Number of chickens raised must be at most 50."

[[problem_units]]
id = "U12"
kind = "constraint"
content = "Number of cows raised must be at least 10."

[[problem_units]]
id = "U13"
kind = "constraint"
content = "Number of sheep raised must be at least 20."

[[problem_units]]
id = "U14"
kind = "constraint"
content = "Total number of animals (cows + sheep + chickens) cannot exceed 100."

[[problem_units]]
id = "U15"
kind = "objective"
content = "Maximize total profit, where profit is the difference between the selling price and the feed cost for all animals raised."

[[hidden_slots]]
slot_id = "H1"
name = "missing_objective"
severity = "P0"
severity_reason = "Without the objective, the agent cannot formulate any optimization model, making the problem ill-posed."
problem_unit_id = "U15"
reference_acceptable_questions = ["What is the objective we are trying to achieve? Is it to maximize profit?", "How is profit calculated? Is it just the selling price minus the feed cost per animal?"]
semantic_hit_rule = "The agent must explicitly ask about the optimization objective (maximize profit) and/or how profit is defined (difference between selling price and feed cost)."
failure_modes = ["Assuming the objective is to maximize revenue only (ignoring feed costs).", "Assuming profit is defined as selling price minus some arbitrary operation cost not specified."]
simulator_answer = "We want to maximize the total profit. Profit is simply the selling price we get for each animal minus the feed cost for that animal."

[initial_brief]
visible_unit_ids = ["U1", "U10", "U11", "U12", "U13", "U14", "U2", "U3", "U4", "U5", "U6", "U7", "U8", "U9"]
content = "I need help deciding how many cows, sheep, and chickens to raise for a farm, while ensuring that total manure produced per day cannot exceed 800 units, the number of chickens raised must be at most 50, the number of cows raised must be at least 10, the number of sheep raised must be at least 20, and the total number of animals (cows + sheep + chickens) cannot exceed 100.\n\nSelling prices: cow $500, sheep $200, chicken $8.\n\nFeed costs per animal: cow $100, sheep $80, chicken $5.\n\nManure production per animal per day: cow 10 units, sheep 5 units, chicken 3 units.\n\nManure handling capacity: 800 units per day.\n\nMaximum number of chickens allowed: 50.\n\nMinimum number of cows required: 10.\n\nMinimum number of sheep required: 20.\n\nMaximum total number of animals: 100."

[simulator]
business_role = "business stakeholder providing the original optimization problem"
knowledge_boundary = "The simulated user knows the case-defined hidden-slot answers when asked, but must not invent facts beyond the case-defined problem units."

[solver_verification]
status = "not_run"
solver_script = ""
verified_at = ""
objective_value = ""
solution = ""
notes = "Do not fill route or decision-variable values until a reproducible solver run has been recorded."
