[metadata]
schema_version = "0.3"
benchmark = "OR-Clarify"
case_id = "orclarify_040"

[[problem_units]]
id = "U1"
kind = "context"
content = "I need help analyzing Carelland's export and import strategy."

[[problem_units]]
id = "U2"
kind = "data"
content = "Unit prices in world market (Klunz): steel 500, engines 1500, electronic components 300, plastic 1200."

[[problem_units]]
id = "U3"
kind = "data"
content = "Production input requirements per unit:\n- Steel: 0.02 engines, 0.01 plastic, 250 Klunz imported goods, 6 person-months labor.\n- Engines: 0.8 steel, 0.15 electronic components, 0.11 plastic, 300 Klunz imported goods, 1 person-year labor.\n- Electronics: 0.01 steel, 0.01 engines, 0.05 plastic, 50 Klunz imported goods, 6 person-months labor.\n- Plastic: 0.03 engines, 0.2 steel, 0.05 electronic components, 300 Klunz imported goods, 2 person-years labor."

[[problem_units]]
id = "U4"
kind = "data"
content = "Engine production limit: 650000 units; Plastic production limit: 60000 units."

[[problem_units]]
id = "U5"
kind = "constraint"
content = "Production of engines must not exceed 650,000 units; production of plastic must not exceed 60,000 units."

[[problem_units]]
id = "U6"
kind = "data"
content = "Total available labor force per year: 830,000 person-months."

[[problem_units]]
id = "U7"
kind = "constraint"
content = "Total labor used in production cannot exceed 830,000 person-months per year."

[[problem_units]]
id = "U8"
kind = "objective"
content = "Maximize domestic GDP."

[[hidden_slots]]
slot_id = "H1"
name = "missing_objective"
severity = "P0"
severity_reason = "Without the objective, the modeling agent cannot formulate a coherent optimization model. The absence of what to maximize makes the problem ill-posed and impossible to solve meaningfully."
problem_unit_id = "U8"
reference_acceptable_questions = ["What should be the objective of this optimization model?", "What exactly are we trying to maximize?"]
semantic_hit_rule = "The agent's question must explicitly ask about the missing objective function. It should inquire what the model should maximize, and the response must identify that the goal is to maximize domestic GDP."
failure_modes = ["Assuming the objective is to maximize total export revenue", "Assuming the objective is to minimize import costs", "Assuming a multi-objective without clarification"]
simulator_answer = "Our goal is to maximize the country's domestic GDP. That's the main target we want to achieve with the export and production plan."

[initial_brief]
visible_unit_ids = ["U1", "U5", "U7", "U2", "U3", "U4", "U6"]
content = "I need help analyzing Carelland's export and import strategy, where production of engines must not exceed 650,000 units and plastic must not exceed 60,000 units, and total labor used in production cannot exceed 830,000 person-months per year.\n\nUnit prices in world market (Klunz): steel 500, engines 1500, electronic components 300, plastic 1200.\n\nProduction input requirements per unit:\n- Steel: 0.02 engines, 0.01 plastic, 250 Klunz imported goods, 6 person-months labor.\n- Engines: 0.8 steel, 0.15 electronic components, 0.11 plastic, 300 Klunz imported goods, 1 person-year labor.\n- Electronics: 0.01 steel, 0.01 engines, 0.05 plastic, 50 Klunz imported goods, 6 person-months labor.\n- Plastic: 0.03 engines, 0.2 steel, 0.05 electronic components, 300 Klunz imported goods, 2 person-years labor.\n\nEngine production limit: 650000 units; Plastic production limit: 60000 units.\n\nTotal available labor force per year: 830,000 person-months."

[simulator]
business_role = "business stakeholder providing the original optimization problem"
knowledge_boundary = "The simulated user knows the case-defined hidden-slot answers when asked, but must not invent facts beyond the case-defined problem units."

