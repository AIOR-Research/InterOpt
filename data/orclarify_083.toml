[metadata]
schema_version = "0.3"
benchmark = "OR-Clarify"
case_id = "orclarify_083"

[[problem_units]]
id = "U1"
kind = "context"
content = "I need help scheduling waiters for a restaurant that operates 24 hours a day."

[[problem_units]]
id = "U2"
kind = "data"
content = "Table 1.1\n\n| Time        | Minimum Number of Waiters Needed | Time        | Minimum Number of Waiters Needed |\n|:-----------:|:-------------------------------:|:-----------:|:-------------------------------:|\n| $2 \\sim 6$  | 4                                | $14 \\sim 18$| 7                                |\n| $6 \\sim 10$ | 8                                | $18 \\sim 22$| 12                               |\n| $10 \\sim 14$| 10                               | $22 \\sim 2$ | 4                                |"

[[problem_units]]
id = "U3"
kind = "objective"
content = "Minimize the total number of waiters employed."

[[problem_units]]
id = "U4"
kind = "constraint"
content = "Each waiter works continuously for 8 hours a day."

[[problem_units]]
id = "U5"
kind = "constraint"
content = "At each time interval, the number of waiters on duty must be at least the minimum number of waiters needed as shown in Table 1.1."

[[hidden_slots]]
slot_id = "H1"
name = "continuous_8hour_shift"
severity = "P0"
severity_reason = "Without knowing that each waiter works exactly 8 continuous hours, it's impossible to define shift start times and coverage constraints; any model built without this assumption would be structurally invalid for the restaurant scheduling problem."
problem_unit_id = "U4"
reference_acceptable_questions = ["How many hours does each waiter work per day, and are these hours consecutive?", "Do the waiters work in 8-hour continuous shifts?"]
semantic_hit_rule = "The agent's question must explicitly ask about the length of a waiter's daily working hours and whether those hours are consecutive."
failure_modes = ["Assuming waiters can work any number of hours as long as the minimum staffing is met", "Assuming that shifts can be split into non-contiguous blocks (e.g., two 4-hour periods)", "Assuming each waiter works for the entire 24-hour day"]
simulator_answer = "Each waiter works a continuous 8-hour shift every day. So their shift is a single block of 8 consecutive hours."

[initial_brief]
visible_unit_ids = ["U1", "U3", "U5", "U2"]
content = "I need help scheduling waiters for a restaurant that operates 24 hours a day, aiming to minimize the total number of waiters employed, while ensuring that at each time interval, the number of waiters on duty is at least the minimum number of waiters needed as shown in Table 1.1.\n\nTable 1.1\n\n| Time        | Minimum Number of Waiters Needed | Time        | Minimum Number of Waiters Needed |\n|:-----------:|:-------------------------------:|:-----------:|:-------------------------------:|\n| $2 \\sim 6$  | 4                                | $14 \\sim 18$| 7                                |\n| $6 \\sim 10$ | 8                                | $18 \\sim 22$| 12                               |\n| $10 \\sim 14$| 10                               | $22 \\sim 2$ | 4                                |"

