[metadata]
schema_version = "0.3"
benchmark = "OR-Clarify"
case_id = "orclarify_024"

[[problem_units]]
id = "U1"
kind = "context"
content = "I need help planning the transportation of products from the warehouse to sales points."

[[problem_units]]
id = "U2"
kind = "data"
content = "Number of sales points: 3."

[[problem_units]]
id = "U3"
kind = "data"
content = "Transportation options: truck, van, motorcycle, electric vehicle."

[[problem_units]]
id = "U4"
kind = "data"
content = "Transport capacities per trip (units): truck 100, van 80, motorcycle 40, electric vehicle 60."

[[problem_units]]
id = "U5"
kind = "data"
content = "Pollution generated per trip (units): truck 100, van 50, motorcycle 10, electric vehicle 0."

[[problem_units]]
id = "U6"
kind = "data"
content = "Delivery target: 1800 units."

[[problem_units]]
id = "U7"
kind = "data"
content = "Maximum total pollution allowed: 2000 units."

[[problem_units]]
id = "U8"
kind = "data"
content = "Minimum number of truck trips: 10."

[[problem_units]]
id = "U9"
kind = "constraint"
content = "Either vans or electric vehicles can be used, but not both."

[[problem_units]]
id = "U10"
kind = "constraint"
content = "Total pollution from all trips must not exceed 2000 units."

[[problem_units]]
id = "U11"
kind = "constraint"
content = "The number of truck trips must be at least 10."

[[problem_units]]
id = "U12"
kind = "constraint"
content = "Total units delivered must be at least 1800 units."

[[problem_units]]
id = "U13"
kind = "objective"
content = "Minimize the total pollution generated."

[[hidden_slots]]
slot_id = "H1"
name = "van_ev_mutual_exclusion"
severity = "P1"
severity_reason = "Without this constraint, the model could allow both vans and electric vehicles, leading to a solution that violates the operational restriction. The problem remains coherent, but the plan would be business-invalid."
problem_unit_id = "U9"
reference_acceptable_questions = ["Can I use both vans and electric vehicles in the transportation plan, or must I choose only one type?", "Is it allowed to mix vans and electric vehicles, or do they need to be mutually exclusive?"]
semantic_hit_rule = "The agent's question must explicitly ask whether vans and electric vehicles can be used together or must be mutually exclusive."
failure_modes = ["Assuming both vans and electric vehicles can be used simultaneously without restriction.", "Not considering the mutual exclusivity clause, leading to a model that combines them."]
simulator_answer = "Due to high energy consumption, we can use either vans or electric vehicles, but not both. So you need to pick one type or the other, not mix them."

[[hidden_slots]]
slot_id = "H2"
name = "minimize_total_pollution_objective"
severity = "P0"
severity_reason = "Without a stated objective, the optimization problem is ill-posed; the modeling agent cannot define optimality, making modeling impossible."
problem_unit_id = "U13"
reference_acceptable_questions = ["What is the objective we should optimize? For example, is it minimizing total pollution, total cost, or something else?", "You mentioned minimizing total pollution; is that the primary goal for this transportation plan?"]
semantic_hit_rule = "The agent must ask about the objective function, specifically confirming whether it is to minimize total pollution or clarifying what to optimize."
failure_modes = ["Assuming the objective is to minimize total cost when no cost data is provided.", "Assuming the objective is to minimize the number of trips.", "Leaving the objective unspecified and formulating an arbitrary or infeasible model."]
simulator_answer = "We want to minimize the total pollution generated from all the trips. That's the main goal, while still delivering at least 1800 units."

[initial_brief]
visible_unit_ids = ["U1", "U10", "U11", "U12", "U2", "U3", "U4", "U5", "U6", "U7", "U8"]
content = "I need help planning the transportation of products from the warehouse to sales points, ensuring that total pollution from all trips must not exceed 2000 units, the number of truck trips must be at least 10, and total units delivered must be at least 1800 units.\n\nNumber of sales points: 3.\n\nTransportation options: truck, van, motorcycle, electric vehicle.\n\nTransport capacities per trip (units): truck 100, van 80, motorcycle 40, electric vehicle 60.\n\nPollution generated per trip (units): truck 100, van 50, motorcycle 10, electric vehicle 0.\n\nDelivery target: 1800 units.\n\nMaximum total pollution allowed: 2000 units.\n\nMinimum number of truck trips: 10."

[simulator]
business_role = "business stakeholder providing the original optimization problem"
knowledge_boundary = "The simulated user knows the case-defined hidden-slot answers when asked, but must not invent facts beyond the case-defined problem units."

