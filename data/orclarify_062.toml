[metadata]
schema_version = "0.3"
benchmark = "OR-Clarify"
case_id = "orclarify_062"

[[problem_units]]
id = "U1"
kind = "context"
content = "I need help deciding which restaurants to purchase to maximize annual income."

[[problem_units]]
id = "U2"
kind = "data"
content = "Annual revenue of each restaurant: Restaurant A: $15,000, Restaurant B: $40,000, Restaurant C: $30,000, Restaurant D: $50,000."

[[problem_units]]
id = "U3"
kind = "data"
content = "Cost of each restaurant: Restaurant A: 1.6 million, Restaurant B: 2.5 million, Restaurant C: 1.8 million, Restaurant D: 3 million."

[[problem_units]]
id = "U4"
kind = "data"
content = "Investment budget: 6 million."

[[problem_units]]
id = "U5"
kind = "objective"
content = "Maximize annual income."

[[problem_units]]
id = "U6"
kind = "constraint"
content = "Each restaurant can be purchased at most once."

[[problem_units]]
id = "U7"
kind = "constraint"
content = "Total cost of purchased restaurants must not exceed the investment budget."

[[problem_units]]
id = "U8"
kind = "constraint"
content = "If Restaurant D is purchased, then Restaurant A cannot be purchased."

[[hidden_slots]]
slot_id = "H1"
name = "binary_purchase_constraint"
severity = "P1"
severity_reason = "Without clarifying that purchases are all-or-nothing, the agent may model fractional investment, leading to a materially different optimization problem and solution."
problem_unit_id = "U6"
reference_acceptable_questions = ["Can the family buy only a part of a restaurant, or do they have to buy the entire restaurant?", "Is fractional ownership allowed, or is each purchase an all-or-nothing decision?"]
semantic_hit_rule = "The agent's question must explicitly ask about whether the purchase is binary (whole restaurant) or allows fractional shares."
failure_modes = ["Assuming fractional investment is allowed and solving a continuous knapsack problem.", "Modeling purchase amounts as continuous variables without 0-1 integrality."]
simulator_answer = "The Zhang family must buy each restaurant entirely or not at all; they can't purchase just a portion."

[[hidden_slots]]
slot_id = "H2"
name = "conditional_exclusion_restaurant_D_and_A"
severity = "P1"
severity_reason = "If the agent remains unaware of this dependency, the model will treat all restaurant choices as independent, likely selecting both A and D if budget allows, which is not allowed."
problem_unit_id = "U8"
reference_acceptable_questions = ["Are there any restrictions between buying certain restaurants, such as not being able to buy both A and D?", "If they purchase Restaurant D, does that affect whether they can purchase Restaurant A?"]
semantic_hit_rule = "The agent's question must explicitly ask about a restriction or dependency involving Restaurant A and D, particularly that buying D prevents buying A."
failure_modes = ["Assuming all restaurants are independent and including both A and D in the solution when budget allows.", "Modeling a standard 0-1 knapsack without mutual exclusion constraints."]
simulator_answer = "There is a special condition: if they decide to buy Restaurant D, then they cannot purchase Restaurant A."

[initial_brief]
visible_unit_ids = ["U1", "U5", "U7", "U2", "U3", "U4"]
content = "I need help deciding which restaurants to purchase to maximize annual income, and the total cost of purchased restaurants must not exceed the investment budget.\n\nAnnual revenue of each restaurant: Restaurant A: $15,000, Restaurant B: $40,000, Restaurant C: $30,000, Restaurant D: $50,000.\n\nCost of each restaurant: Restaurant A: 1.6 million, Restaurant B: 2.5 million, Restaurant C: 1.8 million, Restaurant D: 3 million.\n\nInvestment budget: 6 million."

[simulator]
business_role = "business stakeholder providing the original optimization problem"
knowledge_boundary = "The simulated user knows the case-defined hidden-slot answers when asked, but must not invent facts beyond the case-defined problem units."

[solver_verification]
status = "not_run"
solver_script = ""
verified_at = ""
objective_value = ""
solution = ""
notes = "Do not fill route or decision-variable values until a reproducible solver run has been recorded."
