[[problem_units]]
id = "U5"
kind = "data"
content = "Maximum number of available trucks: 5. Truck capacity: 200 units."

[[problem_units]]
id = "U6"
kind = "data"
content = "Fixed service time per customer: 90 minutes."

[[problem_units]]
id = "U7"
kind = "constraint"
content = "All customer demands must be met."

[[problem_units]]
id = "U8"
kind = "constraint"
content = "Each customer must be served by exactly one vehicle."

[[problem_units]]
id = "U9"
kind = "constraint"
content = "Vehicles must start from the depot and return to the depot."

[[problem_units]]
id = "U10"
kind = "constraint"
content = "At most 5 trucks can be used."

[[problem_units]]
id = "U11"
kind = "constraint"
content = "The total demand of customers on a single route must not exceed the truck capacity of 200 units."

[[problem_units]]
id = "U12"
kind = "constraint"
content = "Each customer has a hard time window; service can only begin within that window. If a vehicle arrives early, it must wait; late arrival is not permitted."

[[problem_units]]
id = "U13"
kind = "objective"
content = "Minimize the total distance traveled by all vehicles."

[[hidden_slots]]
slot_id = "H1"
name = "single_vehicle_per_customer"
severity = "P1"
severity_reason = "Without this clarification, the agent may assume split deliveries are permitted, leading to a fundamentally different problem (Split Delivery VRP) that could yield lower-cost solutions but violates the real business rule."
problem_unit_id = "U8"
reference_acceptable_questions = ["Does each customer need to be served entirely by a single truck, or can their demand be split across multiple vehicles?", "Can a customer's delivery be split between two different trucks, or must one truck handle their whole order?"]
semantic_hit_rule = "The agent's question must explicitly ask whether a customer's demand can be split across multiple vehicles or if each customer must be serviced by exactly one vehicle."
failure_modes = ["Assuming split deliveries are allowed and modeling with capacity constraints allowing demand splitting.", "Building routes where a single customer is visited by multiple vehicles."]
simulator_answer = "Each customer must be served by exactly one vehicle. So a customer's entire demand must be handled by one truck in a single visit."

[[hidden_slots]]
slot_id = "H2"
name = "depot_return_requirement"
severity = "P1"
severity_reason = "Without this, the agent may assume vehicles do not need to return to the depot (Open VRP), removing return‑trip costs and potentially underestimating total distance while violating operational rules."
problem_unit_id = "U9"
reference_acceptable_questions = ["Do the trucks need to return to the depot at the end of their routes, or can they finish at any customer?", "Is returning to the depot mandatory after completing all deliveries?"]
semantic_hit_rule = "The agent's question must explicitly ask whether vehicles must return to the depot or if routes can be open."
failure_modes = ["Assuming vehicles do not have to return to the depot and modelling routes that end at the last customer.", "Assuming the depot return is optional or can be ignored in distance calculation."]
simulator_answer = "All trucks must start from the depot and return to the depot at the end of their routes."

