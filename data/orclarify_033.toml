[metadata]
schema_version = "0.3"
benchmark = "OR-Clarify"
case_id = "orclarify_033"

[[problem_units]]
id = "U1"
kind = "context"
content = "A wealthy noble passed away, leaving an inheritance to be shared between two sons. I need help dividing the items."

[[problem_units]]
id = "U2"
kind = "data"
content = "- A painting by Caillebotte: $25000\n- A bust of Diocletian: $5000\n- A Yuan dynasty Chinese vase: $20000\n- A 911 Porsche: $40000\n- Three diamonds: each $12000\n- A Louis XV sofa: $3000\n- Two very precious Jack Russell racing dogs: each $3000 (will stipulates they must not be separated)\n- A sculpture from 200 AD: $10000\n- A sailing boat: $15000\n- A Harley Davidson motorcycle: $10000\n- A piece of furniture once belonging to Cavour: $13000"

[[problem_units]]
id = "U3"
kind = "objective"
content = "Minimize the difference in value between the two parts."

[[problem_units]]
id = "U4"
kind = "constraint"
content = "The two Jack Russell racing dogs must not be separated; they must both be assigned to the same son."

[[hidden_slots]]
slot_id = "H1"
name = "missing_objective_minimize_value_difference"
severity = "P0"
severity_reason = "Without a stated objective, the problem lacks a goal, making it impossible to formulate a meaningful optimization model. The agent must clarify what the division is supposed to achieve (minimize value difference, maximize fairness, etc.)."
problem_unit_id = "U3"
reference_acceptable_questions = ["What is the goal for dividing the inheritance? Are we trying to give both sons shares of as equal total value as possible?", "Should we minimize the absolute difference between the total values of the two parts?"]
semantic_hit_rule = "The agent's question must explicitly ask about the objective or goal, such as whether we are minimizing the difference in total value, achieving equal sums, or some other fairness criterion."
failure_modes = ["Assuming the goal is merely to assign items without any quantitative objective", "Assuming the objective is to maximize one son's total value", "Assuming a simple equal split of the number of items rather than value", "Assuming the sum of values must be equal without explicitly modeling difference minimization"]
simulator_answer = "We want to split the items so that the total dollar values of the two shares are as close as possible. The aim is to minimize the difference in value between the two parts."

[initial_brief]
visible_unit_ids = ["U1", "U4", "U2"]
content = "A wealthy noble passed away, leaving an inheritance to be shared between two sons, and I need help dividing the items, but the two Jack Russell racing dogs must not be separated—they must both be assigned to the same son.\n\n- A painting by Caillebotte: $25000\n- A bust of Diocletian: $5000\n- A Yuan dynasty Chinese vase: $20000\n- A 911 Porsche: $40000\n- Three diamonds: each $12000\n- A Louis XV sofa: $3000\n- Two very precious Jack Russell racing dogs: each $3000 (will stipulates they must not be separated)\n- A sculpture from 200 AD: $10000\n- A sailing boat: $15000\n- A Harley Davidson motorcycle: $10000\n- A piece of furniture once belonging to Cavour: $13000"

[simulator]
business_role = "business stakeholder providing the original optimization problem"
knowledge_boundary = "The simulated user knows the case-defined hidden-slot answers when asked, but must not invent facts beyond the case-defined problem units."

