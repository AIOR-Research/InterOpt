[metadata]
schema_version = "0.3"
benchmark = "OR-Clarify"
case_id = "orclarify_049"

[[problem_units]]
id = "U1"
kind = "context"
content = "I need help creating a warehouse space rental plan for the next 4 months."

[[problem_units]]
id = "U2"
kind = "data"
content = "Table 1-14:\n| Month | 1    | 2    | 3    | 4    |\n|-------|------|------|------|------|\n| Required area | 1500 | 1000 | 2000 | 1200 |"

[[problem_units]]
id = "U3"
kind = "data"
content = "Table 1-15:\n| Contract length (months) | 1  | 2  | 3  | 4  |\n|--------------------------|----|----|----|----|\n| Rental fee per 100㎡ (yuan) | 4000 | 7500 | 10500 | 13000 |"

[[problem_units]]
id = "U4"
kind = "constraint"
content = "Each contract must cover consecutive months starting from the beginning of the period."

[[problem_units]]
id = "U5"
kind = "constraint"
content = "Each warehouse contract must fully cover the selected months."

[[problem_units]]
id = "U6"
kind = "assumption"
content = "The company may rent multiple warehouses in parallel."

[[problem_units]]
id = "U7"
kind = "assumption"
content = "The available capacity of each warehouse is unlimited (i.e., any contract can cover the full required area or part of it)."

[[problem_units]]
id = "U8"
kind = "constraint"
content = "At least two different contracts (with different lengths) must be signed over the 4 months."

[[problem_units]]
id = "U9"
kind = "constraint"
content = "If a 4-month contract is chosen, then no 1-month contract may be chosen (mutual exclusion)."

[[problem_units]]
id = "U10"
kind = "constraint"
content = "The number of distinct warehouse contracts signed cannot exceed 3."

[[problem_units]]
id = "U11"
kind = "constraint"
content = "The demand for each month must be fully satisfied without shortage or excess."

[[problem_units]]
id = "U12"
kind = "objective"
content = "Minimize the total rental cost over the 4 months."

[[hidden_slots]]
slot_id = "H1"
name = "contract_full_coverage"
severity = "P2"
severity_reason = "Without this rule, the remaining constraints (consecutive months and exact demand satisfaction) already implicitly force that a contract must be used for its entire term if it is signed, so the missing statement primarily adds clarity but does not fundamentally alter the feasible solution space. The optimization problem remains coherent and solvable."
problem_unit_id = "U5"
reference_acceptable_questions = ["If I sign a 2‑month contract, am I obligated to keep that warehouse for both months, or can I use it for only one of them?", "Does a signed contract force me to use the space for every month in its coverage period?"]
semantic_hit_rule = "The agent’s question must explicitly ask whether a contract, once signed for a certain length, must be kept (or remain active) for all months in that period, or whether partial usage is allowed."
failure_modes = ["Assuming a 2‑month contract can be used to cover only month 1 while month 2 is covered by a different contract, without any penalty.", "Modeling contracts without linking rental commitment to the entire term, which could lead to solutions that do not respect the mandatory full‑period obligation."]
simulator_answer = "Yes, once you sign a warehouse contract for a certain length, it must fully cover all the months in that range. You can’t use it for only part of the term."

[[hidden_slots]]
slot_id = "H2"
name = "contract_length_diversity"
severity = "P1"
severity_reason = "Without this risk‑management rule, the model remains a valid cost‑minimization problem, but the resulting solution is likely to ignore a deliberate business requirement and may be materially different from the intended plan. The agent can still formulate a coherent MILP, so it is not a fatal gap, but it should be clarified to avoid a business‑irrelevant answer."
problem_unit_id = "U8"
reference_acceptable_questions = ["Is there any requirement to diversify the contract lengths, or can I use only one type of contract for the whole period?", "Do I have to sign contracts with at least two different durations, or is it okay to use just 2‑month contracts all the way?"]
semantic_hit_rule = "The agent must ask whether the rental plan is forced to include contracts of at least two distinct lengths, or whether a single contract type is acceptable."
failure_modes = ["Assuming any combination of contracts is allowed, including using only 2‑month contracts throughout the horizon.", "Ignoring the diversification constraint entirely, which could produce a solution that violates the risk‑management policy."]
simulator_answer = "For risk management reasons, we must sign at least two contracts of different lengths over the 4‑month period."

[[hidden_slots]]
slot_id = "H3"
name = "max_distinct_contracts"
severity = "P2"
severity_reason = "This operational simplification rule limits the number of distinct contract types. The problem remains a well‑defined optimization even without it; removing the limit simply yields a potentially larger set of feasible solutions. The core modeling structure is unaffected, so it is a low‑impact detail."
problem_unit_id = "U10"
reference_acceptable_questions = ["Is there a maximum on how many different types of contracts I can sign?", "Can I sign more than three distinct warehouse contracts, or is there a limit?"]
semantic_hit_rule = "The agent must inquire about a limit on the count of distinct contract lengths (or types) that can be used."
failure_modes = ["Assuming there is no cap on the number of different contracts, possibly leading to solutions with four or more distinct contract lengths.", "Modeling without a variable‑count constraint, missing the operational preference for simplicity."]
simulator_answer = "We want to keep operations simple, so we can’t sign more than three distinct warehouse contracts in total."

[[hidden_slots]]
slot_id = "H4"
name = "demand_exact_satisfaction"
severity = "P0"
severity_reason = "Without the requirement that demand must be met exactly each month (no shortage, no excess), the model has no constraint that connects rented space to the given required areas. The cost objective would drive rented quantities to zero, making the problem ill‑posed and impossible to formulate meaningfully."
problem_unit_id = "U11"
reference_acceptable_questions = ["Do I have to cover exactly the required area each month, or can I rent extra space or fall short?", "Is it mandatory to meet the monthly demands precisely, with no surplus and no deficit?"]
semantic_hit_rule = "The agent must ask whether the monthly rental amounts must exactly match the given required areas, or whether oversupply/undersupply is allowed."
failure_modes = ["Omitting the balance constraints entirely, leading to a trivial solution of renting nothing.", "Assuming excess capacity is permitted at no cost, which would produce a different feasible set than intended."]
simulator_answer = "Every month we must provide exactly the required warehouse area – not more, not less. No shortages and no excess space are allowed."

[[hidden_slots]]
slot_id = "H5"
name = "objective_minimize_cost"
severity = "P0"
severity_reason = "The objective is the core driver of the optimization; without knowing that the goal is to minimize total rental cost, the agent cannot define a meaningful objective function. The problem would be ill‑posed because no performance criterion is given."
problem_unit_id = "U12"
reference_acceptable_questions = ["What is the main goal – are we trying to minimize total rental expenditure, or something else?", "Is the objective simply to spend as little as possible on rent over the whole period?"]
semantic_hit_rule = "The agent must explicitly ask for the optimization goal or confirm that the objective is to minimize total rental cost."
failure_modes = ["Formulating a model without an objective function, or assuming a different objective such as minimizing the number of contracts.", "Treating the problem as a feasibility exercise rather than a cost‑driven optimization."]
simulator_answer = "We want to keep the total rental cost across all four months as low as possible. So the objective is to minimize the overall renting expense."

[initial_brief]
visible_unit_ids = ["U1", "U4", "U6", "U7", "U9", "U2", "U3"]
content = "I need help creating a warehouse space rental plan for the next 4 months. Each contract must cover consecutive months starting from the beginning of the period, and if a 4-month contract is chosen, then no 1-month contract may be chosen (mutual exclusion). The company may rent multiple warehouses in parallel, and the available capacity of each warehouse is unlimited (i.e., any contract can cover the full required area or part of it).\n\nTable 1-14:\n| Month | 1    | 2    | 3    | 4    |\n|-------|------|------|------|------|\n| Required area | 1500 | 1000 | 2000 | 1200 |\n\nTable 1-15:\n| Contract length (months) | 1  | 2  | 3  | 4  |\n|--------------------------|----|----|----|----|\n| Rental fee per 100㎡ (yuan) | 4000 | 7500 | 10500 | 13000 |"

[simulator]
business_role = "business stakeholder providing the original optimization problem"
knowledge_boundary = "The simulated user knows the case-defined hidden-slot answers when asked, but must not invent facts beyond the case-defined problem units."

