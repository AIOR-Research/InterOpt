[metadata]
schema_version = "0.3"
benchmark = "OR-Clarify"
case_id = "orclarify_079"

[[problem_units]]
id = "U1"
kind = "context"
content = "I need help deciding how many tables, chairs, and bookshelves to produce."

[[problem_units]]
id = "U2"
kind = "data"
content = "Selling prices: table $200, chair $50, bookshelf $150."

[[problem_units]]
id = "U3"
kind = "data"
content = "Manufacturing costs: table $120, chair $20, bookshelf $90."

[[problem_units]]
id = "U4"
kind = "data"
content = "Space occupancy: table 5 sq m, chair 2 sq m, bookshelf 3 sq m."

[[problem_units]]
id = "U5"
kind = "data"
content = "Total available warehouse space: 500 sq m."

[[problem_units]]
id = "U6"
kind = "data"
content = "Minimum required production: tables 10, bookshelves 20."

[[problem_units]]
id = "U7"
kind = "data"
content = "Total production capacity: 200 items."

[[problem_units]]
id = "U8"
kind = "constraint"
content = "The total warehouse space occupied by the products cannot exceed 500 square meters."

[[problem_units]]
id = "U9"
kind = "constraint"
content = "At least 10 tables must be produced."

[[problem_units]]
id = "U10"
kind = "constraint"
content = "At least 20 bookshelves must be produced."

[[problem_units]]
id = "U11"
kind = "constraint"
content = "The total number of items produced cannot exceed 200."

[[problem_units]]
id = "U12"
kind = "objective"
content = "Maximize total profit."

[[problem_units]]
id = "U13"
kind = "assumption"
content = "Profit for each product is the selling price minus the manufacturing cost."

[[hidden_slots]]
slot_id = "H1"
name = "missing_objective"
severity = "P0"
severity_reason = "Without specifying the objective, the modeling agent cannot formulate an optimization model; the problem would be ill-posed and the agent would not know what to optimize."
problem_unit_id = "U12"
reference_acceptable_questions = ["What is the objective we are trying to achieve? Are we maximizing profit?", "What should be our goal when deciding production quantities?"]
semantic_hit_rule = "The agent's question must explicitly ask about the objective or goal of the production problem, such as maximizing profit, minimizing cost, or some other metric."
failure_modes = ["Assuming the objective is to minimize total manufacturing cost", "Assuming the goal is to maximize total revenue", "Assuming no objective and just producing to meet minimum requirements"]
simulator_answer = "We want to maximize total profit."

[initial_brief]
visible_unit_ids = ["U1", "U8", "U9", "U10", "U11", "U13", "U2", "U3", "U4", "U5", "U6", "U7"]
content = "I need help deciding how many tables, chairs, and bookshelves to produce, where the total warehouse space occupied by the products cannot exceed 500 square meters, at least 10 tables and at least 20 bookshelves must be produced, and the total number of items produced cannot exceed 200. Profit for each product is the selling price minus the manufacturing cost.\n\nSelling prices: table $200, chair $50, bookshelf $150.\n\nManufacturing costs: table $120, chair $20, bookshelf $90.\n\nSpace occupancy: table 5 sq m, chair 2 sq m, bookshelf 3 sq m.\n\nTotal available warehouse space: 500 sq m.\n\nMinimum required production: tables 10, bookshelves 20.\n\nTotal production capacity: 200 items."

[simulator]
business_role = "business stakeholder providing the original optimization problem"
knowledge_boundary = "The simulated user knows the case-defined hidden-slot answers when asked, but must not invent facts beyond the case-defined problem units."

[solver_verification]
status = "not_run"
solver_script = ""
verified_at = ""
objective_value = ""
solution = ""
notes = "Do not fill route or decision-variable values until a reproducible solver run has been recorded."
