[metadata]
schema_version = "0.3"
benchmark = "OR-Clarify"
case_id = "orclarify_046"

[[problem_units]]
id = "U1"
kind = "context"
content = "I need help creating a duty scheduling plan for a university computer lab with undergraduate and graduate student workers."

[[problem_units]]
id = "U2"
kind = "data"
content = "Table 5-9: Hourly wage and maximum duty hours from Monday to Friday for each student.\n\n| Student ID | Wage (CNY/h) | Monday | Tuesday | Wednesday | Thursday | Friday |\n|------------|--------------|--------|---------|-----------|----------|--------|\n| 1          | 10.0         | 6      | 0       | 6         | 0        | 7      |\n| 2          | 10.0         | 0      | 8       | 9         | 6        | 0      |\n| 3          | 9.9          | 4      | 8       | 3         | 0        | 5      |\n| 4          | 9.8          | 5      | 5       | 6         | 0        | 4      |\n| 5          | 10.8         | 3      | 0       | 5         | 8        | 0      |\n| 6          | 11.3         | 0      | 6       | 0         | 6        | 5      |"

[[problem_units]]
id = "U3"
kind = "data"
content = "The lab operates from 8:00 AM to 10:00 PM."

[[problem_units]]
id = "U4"
kind = "constraint"
content = "There must be one and only one student on duty during open hours."

[[problem_units]]
id = "U5"
kind = "constraint"
content = "Each undergraduate must work at least 8 hours per week."

[[problem_units]]
id = "U6"
kind = "constraint"
content = "Each graduate student must work at least 7 hours per week."

[[problem_units]]
id = "U7"
kind = "constraint"
content = "Each student can work no more than 2 shifts per week."

[[problem_units]]
id = "U8"
kind = "constraint"
content = "No more than 3 students can be scheduled for duty each day."

[[problem_units]]
id = "U9"
kind = "constraint"
content = "For each student, their working hours on a given day cannot exceed the maximum hours specified in Table 5-9."

[[problem_units]]
id = "U10"
kind = "objective"
content = "Minimize total gross pay (sum over all students of hourly wage multiplied by total hours worked during the week)."

[[hidden_slots]]
slot_id = "H1"
name = "max_shifts_per_week"
severity = "P1"
severity_reason = "Without this constraint, the agent can still formulate a valid scheduling model using daily hour limits and coverage constraints, but the model would be under‑constrained and might assign a student to work on more than 2 distinct days, violating the intended business rule. The agent should clarify this before finalizing."
problem_unit_id = "U7"
reference_acceptable_questions = ["Is there a limit on how many different days a student can work?", "Can a student be scheduled on more than two days of the week?"]
semantic_hit_rule = "The Agent's question must ask about a limit on the number of shifts or working days per student per week."
failure_modes = ["Assuming there is no limit on the number of days a student can work, possibly scheduling a student across all 5 days", "Assuming a 'shift' is the same as a day and not considering distinct time blocks"]
simulator_answer = "Each student cannot work more than 2 shifts in a week."

[[hidden_slots]]
slot_id = "H2"
name = "max_students_per_day"
severity = "P1"
severity_reason = "Missing this constraint leads to a schedule that could assign more than three distinct students on any day, which might be a labor rule the problem intends. The agent can still build a coherent model without it, but the resulting schedule would not comply with the full specification, so clarification is needed for accuracy."
problem_unit_id = "U8"
reference_acceptable_questions = ["Is there a limit on the number of different students who can work on the same day?", "Can I schedule all six students on a single day if their individual hours allow?"]
semantic_hit_rule = "The Agent's question must inquire about a daily limit on the count of distinct students assigned to duty."
failure_modes = ["Assuming any number of students can be used per day as long as only one is on duty at a time", "Overlooking the distinct-student-per-day cap and scheduling 4 or more students on one day"]
simulator_answer = "We are not allowed to have more than 3 different students on duty in a single day."

[[hidden_slots]]
slot_id = "H3"
name = "objective_minimize_gross_pay"
severity = "P0"
severity_reason = "Without an explicit objective, the optimization problem is ill‑posed. The agent cannot build a meaningful model without knowing what to minimize or maximize. The objective must be clarified before modeling."
problem_unit_id = "U10"
reference_acceptable_questions = ["What is the objective of the optimization? Should we minimize total cost?", "Are we trying to minimize the total wage payout?"]
semantic_hit_rule = "The Agent's question must explicitly ask about the optimization goal (objective), such as minimizing total cost or gross pay."
failure_modes = ["Assuming the objective is to minimize the number of students used or total hours worked, rather than gross pay", "Proceeding with a feasibility-only formulation without any objective"]
simulator_answer = "We want to minimize the total gross pay, which is the sum of each student's hourly wage times their total hours worked that week."

[initial_brief]
visible_unit_ids = ["U1", "U4", "U5", "U6", "U9", "U2", "U3"]
content = "I need help creating a duty scheduling plan for a university computer lab with undergraduate and graduate student workers, where there must be one and only one student on duty during open hours. Each undergraduate must work at least 8 hours per week, and each graduate student must work at least 7 hours per week. Additionally, for each student, their working hours on a given day cannot exceed the maximum hours specified in Table 5-9.\n\nTable 5-9: Hourly wage and maximum duty hours from Monday to Friday for each student.\n\n| Student ID | Wage (CNY/h) | Monday | Tuesday | Wednesday | Thursday | Friday |\n|------------|--------------|--------|---------|-----------|----------|--------|\n| 1          | 10.0         | 6      | 0       | 6         | 0        | 7      |\n| 2          | 10.0         | 0      | 8       | 9         | 6        | 0      |\n| 3          | 9.9          | 4      | 8       | 3         | 0        | 5      |\n| 4          | 9.8          | 5      | 5       | 6         | 0        | 4      |\n| 5          | 10.8         | 3      | 0       | 5         | 8        | 0      |\n| 6          | 11.3         | 0      | 6       | 0         | 6        | 5      |\n\nThe lab operates from 8:00 AM to 10:00 PM."

[simulator]
business_role = "business stakeholder providing the original optimization problem"
knowledge_boundary = "The simulated user knows the case-defined hidden-slot answers when asked, but must not invent facts beyond the case-defined problem units."

