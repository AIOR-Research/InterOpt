[metadata]
schema_version = "0.3"
benchmark = "OR-Clarify"
case_id = "orclarify_088"

[[problem_units]]
id = "U1"
kind = "context"
content = "I need help creating a production plan for two fertilizers using two machines."

[[problem_units]]
id = "U2"
kind = "data"
content = "Processing times (minutes per lot):\n| Product | Machine 1 | Machine 2 |\n|--------|----------|----------|\n| Liquid | 50       | 30       |\n| Solid  | 24       | 33       |"

[[problem_units]]
id = "U3"
kind = "data"
content = "On-hand inventory at beginning of week: liquid 30 lots, solid 90 lots."

[[problem_units]]
id = "U4"
kind = "data"
content = "Available time on Machine 1: 40 hours. Available time on Machine 2: 35 hours."

[[problem_units]]
id = "U5"
kind = "data"
content = "Forecast demand for the week: 75 lots of liquid, 95 lots of solid."

[[problem_units]]
id = "U6"
kind = "assumption"
content = "Processing requirements are measured per standardized lot, and planning may use fractional lots when appropriate."

[[problem_units]]
id = "U7"
kind = "objective"
content = "Maximize the total ending inventory of liquid and solid at the end of the week."

[[problem_units]]
id = "U8"
kind = "constraint"
content = "Total processing time on Machine 1 cannot exceed its available time."

[[problem_units]]
id = "U9"
kind = "constraint"
content = "Total processing time on Machine 2 cannot exceed its available time."

[[hidden_slots]]
slot_id = "H1"
name = "unknown_objective"
severity = "P0"
severity_reason = "Without knowing what to optimize, no linear programming model can be formulated. The problem lacks a goal or objective function, making it ill-posed."
problem_unit_id = "U7"
reference_acceptable_questions = ["What is the objective we are trying to achieve? For example, are we maximizing profit, minimizing waste, or something else?", "What should the model maximize or minimize? Is it total production, inventory, or cost?"]
semantic_hit_rule = "The agent asks about the optimization goal or objective function, explicitly inquiring what to maximize or minimize."
failure_modes = ["Assuming the goal is to maximize profit", "Assuming the goal is to meet demand exactly with no inventory consideration"]
simulator_answer = "The goal is to maximize the total ending inventory of both liquid and solid fertilizers at the end of the week."

[initial_brief]
visible_unit_ids = ["U1", "U6", "U8", "U9", "U2", "U3", "U4", "U5"]
content = "I need help creating a production plan for two fertilizers using two machines, where processing requirements are measured per standardized lot and planning may use fractional lots when appropriate, and total processing time on Machine 1 cannot exceed its available time, and total processing time on Machine 2 cannot exceed its available time.\n\nProcessing times (minutes per lot):\n| Product | Machine 1 | Machine 2 |\n|--------|----------|----------|\n| Liquid | 50       | 30       |\n| Solid  | 24       | 33       |\n\nOn-hand inventory at beginning of week: liquid 30 lots, solid 90 lots.\n\nAvailable time on Machine 1: 40 hours. Available time on Machine 2: 35 hours.\n\nForecast demand for the week: 75 lots of liquid, 95 lots of solid."

[simulator]
