[[hidden_slots]]
slot_id = "H1"
name = "truck_capacity_limit"
severity = "P2"
severity_reason = "The truck capacity constraint does not affect the total transportation cost, because cost is per container‑km and the fleet size is not limited. Omitting it still leaves a coherent, solvable optimization problem with the same optimal objective value. It is only a low‑impact operational detail."
problem_unit_id = "U6"
reference_acceptable_questions = ["How many containers can each truck carry at most?", "Is there a limit on the number of containers a truck can transport in one trip?"]
semantic_hit_rule = "The agent's question must explicitly ask about truck capacity or the maximum number of containers allowed per truck."
failure_modes = ["Assuming trucks have unlimited capacity", "Assuming each truck can carry exactly one container"]
simulator_answer = "Our trucks can carry up to 2 containers per trip."

