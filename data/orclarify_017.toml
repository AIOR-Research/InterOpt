[metadata]
schema_version = "0.3"
benchmark = "OR-Clarify"
case_id = "orclarify_017"

[[problem_units]]
id = "U1"
kind = "context"
content = "I need help planning a bombing mission to destroy enemy military targets."

[[problem_units]]
id = "U2"
kind = "data"
content = "The target has four key parts, numbered 1, 2, 3, 4."

[[problem_units]]
id = "U3"
kind = "data"
content = "| Key Part | Distance from Airport (km) | Probability of Destruction per Heavy Bomb | Probability of Destruction per Light Bomb |\n|----------|----------------------------|------------------------------------------|------------------------------------------|\n| 1        | 450                        | 0.03                                     | 0.08                                     |\n| 2        | 480                        | 0.10                                     | 0.11                                     |\n| 3        | 540                        | 0.05                                     | 0.12                                     |\n| 4        | 600                        | 0.05                                     | 0.09                                     |"

[[problem_units]]
id = "U4"
kind = "data"
content = "Heavy bombs available: 28."

[[problem_units]]
id = "U5"
kind = "data"
content = "Light bombs available: 12."

[[problem_units]]
id = "U6"
kind = "data"
content = "Total fuel available: 10,000 liters."

[[problem_units]]
id = "U7"
kind = "data"
content = "When carrying a heavy bomb, fuel efficiency is 2 km per liter."

[[problem_units]]
id = "U8"
kind = "data"
content = "When carrying a light bomb, fuel efficiency is 3 km per liter."

[[problem_units]]
id = "U9"
kind = "data"
content = "When the aircraft is empty (not carrying a bomb), fuel efficiency is 4 km per liter."

[[problem_units]]
id = "U10"
kind = "data"
content = "Each takeoff and landing combined consumes 100 liters of fuel per trip."

[[problem_units]]
id = "U11"
kind = "constraint"
content = "The mission is successful only if at least two of the four key parts are destroyed."

[[problem_units]]
id = "U12"
kind = "constraint"
content = "The number of heavy bombs used cannot exceed 28."

[[problem_units]]
id = "U13"
kind = "constraint"
content = "The number of light bombs used cannot exceed 12."

[[problem_units]]
id = "U14"
kind = "constraint"
content = "Total fuel consumption must not exceed 10,000 liters."

[[problem_units]]
id = "U15"
kind = "constraint"
content = "Each aircraft can carry only one bomb per trip."

[[problem_units]]
id = "U16"
kind = "constraint"
content = "Each bombing run is a round trip from the airport to the target and back."

[[problem_units]]
id = "U17"
kind = "objective"
content = "Maximize the probability of success (destroying at least two key parts)."

[[hidden_slots]]
slot_id = "H1"
name = "missing_one_bomb_per_trip_constraint"
severity = "P1"
severity_reason = "Without this constraint, the modeling agent may assume an aircraft can carry multiple bombs per trip, drastically altering the number of trips, fuel consumption calculations, and the overall model structure, leading to a materially incorrect formulation."
problem_unit_id = "U15"
reference_acceptable_questions = ["Is there a limit on how many bombs a single aircraft can carry on a trip?", "Can an aircraft carry more than one bomb per mission?"]
semantic_hit_rule = "The agent's question must explicitly ask about the number of bombs an aircraft can carry per trip or the per‑trip carrying capacity."
failure_modes = ["Assuming an unlimited number of bombs per aircraft per trip", "Assuming all bombs can be dropped in a single trip"]
simulator_answer = "Each aircraft can only carry one bomb per trip."

[[hidden_slots]]
slot_id = "H2"
name = "missing_objective_probability_maximization"
severity = "P0"
severity_reason = "The objective is the core of the optimization problem; without it, the agent does not know what to maximize, making the problem ill‑posed and preventing any responsible modeling attempt."
problem_unit_id = "U17"
reference_acceptable_questions = ["What exactly are we trying to optimize? Is it the probability of destroying at least two key parts?", "What is the objective of the bombing plan?"]
semantic_hit_rule = "The agent must ask about the objective or what is being maximized."
failure_modes = ["Assuming a different objective like minimizing fuel or bombs used", "Assuming all four parts must be destroyed"]
simulator_answer = "We want to maximize the probability of mission success, which means destroying at least two of the four key parts."

[initial_brief]
visible_unit_ids = ["U1", "U11", "U12", "U13", "U14", "U16", "U2", "U3", "U4", "U5", "U6", "U7", "U8", "U9", "U10"]
content = "I need help planning a bombing mission to destroy enemy military targets. The mission is successful only if at least two of the four key parts are destroyed. The number of heavy bombs used cannot exceed 28, and the number of light bombs used cannot exceed 12. Total fuel consumption must not exceed 10,000 liters, and each bombing run is a round trip from the airport to the target and back.\n\nThe target has four key parts, numbered 1, 2, 3, 4.\n\n| Key Part | Distance from Airport (km) | Probability of Destruction per Heavy Bomb | Probability of Destruction per Light Bomb |\n|----------|----------------------------|------------------------------------------|------------------------------------------|\n| 1        | 450                        | 0.03                                     | 0.08                                     |\n| 2        | 480                        | 0.10                                     | 0.11                                     |\n| 3        | 540                        | 0.05                                     | 0.12                                     |\n| 4        | 600                        | 0.05                                     | 0.09                                     |\n\nHeavy bombs available: 28.\n\nLight bombs available: 12.\n\nTotal fuel available: 10,000 liters.\n\nWhen carrying a heavy bomb, fuel efficiency is 2 km per liter.\n\nWhen carrying a light bomb, fuel efficiency is 3 km per liter.\n\nWhen the aircraft is empty (not carrying a bomb), fuel efficiency is 4 km per liter.\n\nEach takeoff and landing combined consumes 100 liters of fuel per trip."

[simulator]
business_role = "business stakeholder providing the original optimization problem"
knowledge_boundary = "The simulated user knows the case-defined hidden-slot answers when asked, but must not invent facts beyond the case-defined problem units."

