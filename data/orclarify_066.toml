[metadata]
schema_version = "0.3"
benchmark = "OR-Clarify"
case_id = "orclarify_066"

[[problem_units]]
id = "U1"
kind = "context"
content = "I need help creating a production plan for three types of tabletop golf toys."

[[problem_units]]
id = "U2"
kind = "data"
content = "Per-unit labor hours, inspection hours, and profit by toy type:\n\n| Toy Type   | Labor (hours) | Inspection (hours) | Profit (yuan) |\n|------------|---------------|--------------------|---------------|\n| High-end   | 17            | 8                  | 300           |\n| Mid-range  | 10            | 4                  | 200           |\n| Low-end    | 2             | 2                  | 100           |"

[[problem_units]]
id = "U3"
kind = "data"
content = "Total available manufacturing labor hours: 1000."

[[problem_units]]
id = "U4"
kind = "data"
content = "Total available inspection hours: 500."

[[problem_units]]
id = "U5"
kind = "data"
content = "Market demand upper limits:\n\n| Toy Type   | Max Demand (units) |\n|------------|-------------------|\n| High-end   | 50                |\n| Mid-range  | 80                |\n| Low-end    | 150               |"

[[problem_units]]
id = "U6"
kind = "objective"
content = "Maximize total profit."

[[problem_units]]
id = "U7"
kind = "constraint"
content = "Total manufacturing labor hours used by all produced toys must not exceed 1000 hours."

[[problem_units]]
id = "U8"
kind = "constraint"
content = "Total inspection hours used by all produced toys must not exceed 500 hours."

[[problem_units]]
id = "U9"
kind = "constraint"
content = "Production quantity of the high-end type must not exceed 50 units."

[[problem_units]]
id = "U10"
kind = "constraint"
content = "Production quantity of the mid-range type must not exceed 80 units."

[[problem_units]]
id = "U11"
kind = "constraint"
content = "Production quantity of the low-end type must not exceed 150 units."

[[hidden_slots]]
slot_id = "H1"
name = "unknown_objective"
severity = "P0"
severity_reason = "Without clarification of the objective, the modeling agent cannot formulate an optimization model; the problem is missing its primary goal, making it impossible to proceed."
problem_unit_id = "U6"
reference_acceptable_questions = ["What is the goal of the production plan? Are we trying to maximize profit, or should we minimize costs?", "Should I set the objective as total profit maximization?"]
semantic_hit_rule = "The agent's question must ask about the objective of the optimization, specifically whether it is profit maximization or another goal."
failure_modes = ["Silently assuming the objective is to maximize revenue instead of profit.", "Assuming it is a cost-minimization problem without asking."]
simulator_answer = "Yes, we want to maximize the total profit from the production plan."

[initial_brief]
visible_unit_ids = ["U1", "U7", "U8", "U9", "U10", "U11", "U2", "U3", "U4", "U5"]
content = "I need help creating a production plan for three types of tabletop golf toys, where total manufacturing labor hours used by all produced toys must not exceed 1000 hours, total inspection hours used by all produced toys must not exceed 500 hours, and production quantities are constrained so that the high-end type must not exceed 50 units, the mid-range type must not exceed 80 units, and the low-end type must not exceed 150 units.\n\nPer-unit labor hours, inspection hours, and profit by toy type:\n\n| Toy Type   | Labor (hours) | Inspection (hours) | Profit (yuan) |\n|------------|---------------|--------------------|---------------|\n| High-end   | 17            | 8                  | 300           |\n| Mid-range  | 10            | 4                  | 200           |\n| Low-end    | 2             | 2                  | 100           |\n\nTotal available manufacturing labor hours: 1000.\n\nTotal available inspection hours: 500.\n\nMarket demand upper limits:\n\n| Toy Type   | Max Demand (units) |\n|------------|-------------------|\n| High-end   | 50                |\n| Mid-range  | 80                |\n| Low-end    | 150               |"

