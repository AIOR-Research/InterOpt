[metadata]
schema_version = "0.3"
benchmark = "OR-Clarify"
case_id = "orclarify_031"

[[problem_units]]
id = "U1"
kind = "context"
content = "I need help creating a production plan for a factory that produces three types of products across two processing stages."

[[problem_units]]
id = "U2"
kind = "data"
content = "| Equipment | Product I | Product II | Product III | Effective Machine Hours | Processing Cost per Machine Hour (Yuan/hour) |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| A1 | 5 | 10 | - | 6000 | 0.05 |\n| A2 | 7 | 9 | 12 | 10000 | 0.03 |\n| B1 | 6 | 8 | - | 4000 | 0.06 |\n| B2 | 4 | - | 11 | 7000 | 0.11 |\n| B3 | 7 | - | - | 4000 | 0.05 |\n| Raw Material Cost (Yuan/piece) | 0.25 | 0.35 | 0.5 | - | - |\n| Unit Price (Yuan/piece) | 1.25 | 2 | 2.8 | - | - |"

[[problem_units]]
id = "U3"
kind = "constraint"
content = "Each product must undergo two processing stages, A and B."

[[problem_units]]
id = "U4"
kind = "constraint"
content = "Product I can be processed on any type of A equipment (A1 or A2) and any type of B equipment (B1, B2, or B3)."

[[problem_units]]
id = "U5"
kind = "constraint"
content = "Product II can be processed on any type of A equipment (A1 or A2), but for stage B, it can only be processed on B1 equipment."

[[problem_units]]
id = "U6"
kind = "constraint"
content = "Product III can only be processed on A2 equipment for stage A and B2 equipment for stage B."

[[problem_units]]
id = "U7"
kind = "constraint"
content = "The total processing time used on each equipment type cannot exceed its available effective machine hours."

[[problem_units]]
id = "U8"
kind = "objective"
content = "Maximize total profit."

[[hidden_slots]]
slot_id = "H1"
name = "missing_objective"
severity = "P0"
severity_reason = "Without knowing the objective, the model cannot be formulated because the optimization direction (maximize or minimize) and the metric (profit, cost, revenue, etc.) are undefined. The agent would have to guess, likely making the model incorrect."
problem_unit_id = "U8"
reference_acceptable_questions = ["What is the goal of this optimization? Are we maximizing profit?", "Could you clarify what we are trying to optimize? Is it total profit, revenue, or something else?"]
semantic_hit_rule = "The agent's question explicitly references the objective, optimization goal, or what is being maximized/minimized."
failure_modes = ["Assuming the objective is to minimize total cost", "Assuming the objective is to maximize total revenue without considering costs"]
simulator_answer = "We aim to maximize the total profit from the production plan."

[initial_brief]
visible_unit_ids = ["U1", "U3", "U4", "U5", "U6", "U7", "U2"]
content = "I need help creating a production plan for a factory that produces three types of products across two processing stages, where each product must undergo stages A and B. Product I can be processed on any type of A equipment (A1 or A2) and any type of B equipment (B1, B2, or B3), while Product II can be processed on any A equipment but only on B1 equipment for stage B. Product III can only be processed on A2 equipment for stage A and B2 equipment for stage B. Additionally, the total processing time used on each equipment type cannot exceed its available effective machine hours.\n\n| Equipment | Product I | Product II | Product III | Effective Machine Hours | Processing Cost per Machine Hour (Yuan/hour) |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| A1 | 5 | 10 | - | 6000 | 0.05 |\n| A2 | 7 | 9 | 12 | 10000 | 0.03 |\n| B1 | 6 | 8 | - | 4000 | 0.06 |\n| B2 | 4 | - | 11 | 7000 | 0.11 |\n| B3 | 7 | - | - | 4000 | 0.05 |\n| Raw Material Cost (Yuan/piece) | 0.25 | 0.35 | 0.5 | - | - |\n| Unit Price (Yuan/piece) | 1.25 | 2 | 2.8 | - | - |"

[simulator]
business_role = "business stakeholder providing the original optimization problem"
knowledge_boundary = "The simulated user knows the case-defined hidden-slot answers when asked, but must not invent facts beyond the case-defined problem units."

