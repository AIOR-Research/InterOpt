[metadata]
schema_version = "0.3"
benchmark = "OR-Clarify"
case_id = "orclarify_019"

[[problem_units]]
id = "U1"
kind = "context"
content = "I need help creating a chair ordering plan for manufacturers A, B, and C."

[[problem_units]]
id = "U2"
kind = "data"
content = "The cost of ordering each chair from manufacturer A is $50, from manufacturer B is $45, and from manufacturer C is $40."

[[problem_units]]
id = "U3"
kind = "data"
content = "Each order from manufacturer A will include 15 chairs, while each order from manufacturers B and C will include 10 chairs."

[[problem_units]]
id = "U4"
kind = "data"
content = "Minimum total chairs: 100; maximum total chairs: 500."

[[problem_units]]
id = "U5"
kind = "data"
content = "When ordering from manufacturer A, the minimum chairs from manufacturer B is 10."

[[problem_units]]
id = "U6"
kind = "objective"
content = "Minimize the total cost of the order."

[[problem_units]]
id = "U7"
kind = "constraint"
content = "The number of orders must be an integer."

[[problem_units]]
id = "U8"
kind = "constraint"
content = "Total chairs ordered must be at least 100."

[[problem_units]]
id = "U9"
kind = "constraint"
content = "Total chairs ordered must be at most 500."

[[problem_units]]
id = "U10"
kind = "constraint"
content = "If the store orders chairs from manufacturer A, then it must order at least 10 chairs from manufacturer B."

[[problem_units]]
id = "U11"
kind = "constraint"
content = "If the store orders chairs from manufacturer B, then it must also order chairs from manufacturer C."

[[hidden_slots]]
slot_id = "H1"
name = "missing_objective"
severity = "P0"
severity_reason = "Without the objective, there is no optimization criterion; a responsible modeling agent cannot proceed because the problem is completely unguided. The agent would be forced to invent a decisive assumption about what to minimize or maximize."
problem_unit_id = "U6"
reference_acceptable_questions = ["What exactly are we trying to optimize? Is the goal to minimize the total cost of the order?", "Could you clarify the objective – do you want to minimize cost, or is there another target like minimizing the number of orders?"]
semantic_hit_rule = "The Agent's question must explicitly ask about the objective function or what to optimize (minimize/maximize) and cannot simply restate costs without verifying the goal."
failure_modes = ["Silently assuming cost minimization without asking.", "Assuming a different objective (e.g., minimizing number of orders or maximizing profit)."]
simulator_answer = "We want to minimize the total cost of the order."

[initial_brief]
visible_unit_ids = ["U1", "U7", "U8", "U9", "U10", "U11", "U2", "U3", "U4", "U5"]
content = "I need help creating a chair ordering plan for manufacturers A, B, and C. The number of orders must be an integer, and total chairs ordered must be at least 100 and at most 500. If the store orders chairs from manufacturer A, then it must order at least 10 chairs from manufacturer B. Additionally, if the store orders chairs from manufacturer B, then it must also order chairs from manufacturer C.\n\nThe cost of ordering each chair from manufacturer A is $50, from manufacturer B is $45, and from manufacturer C is $40.\n\nEach order from manufacturer A will include 15 chairs, while each order from manufacturers B and C will include 10 chairs.\n\nMinimum total chairs: 100; maximum total chairs: 500.\n\nWhen ordering from manufacturer A, the minimum chairs from manufacturer B is 10."

[simulator]
business_role = "business stakeholder providing the original optimization problem"
knowledge_boundary = "The simulated user knows the case-defined hidden-slot answers when asked, but must not invent facts beyond the case-defined problem units."

[solver_verification]
status = "not_run"
solver_script = ""
verified_at = ""
objective_value = ""
solution = ""
notes = "Do not fill route or decision-variable values until a reproducible solver run has been recorded."
