[metadata]
schema_version = "0.3"
benchmark = "OR-Clarify"
case_id = "orclarify_015"

[[problem_units]]
id = "U1"
kind = "context"
content = "I need help planning tool purchasing and repairing over multiple planning stages."

[[problem_units]]
id = "U2"
kind = "data"
content = "n = 10  # number of stages\nr = [3, 5, 2, 4, 6, 5, 4, 3, 2, 1]  # tool requirements per stage, indexing starts at 1\na = 10  # cost of buying a new tool\nb = 1   # cost of slow repair\nc = 3   # cost of fast repair\np = 3   # slow repair duration\nq = 1   # fast repair duration"

[[problem_units]]
id = "U3"
kind = "objective"
content = "Minimize the cost spent on tools during the planning period."

[[problem_units]]
id = "U4"
kind = "constraint"
content = "At each stage j, the number of available tools must be at least r_j."

[[problem_units]]
id = "U5"
kind = "constraint"
content = "All tools used in a stage must be sent for repair at the end of that stage."

[[problem_units]]
id = "U6"
kind = "constraint"
content = "Tools sent for slow repair at the end of stage j become available at the start of stage j + p."

[[problem_units]]
id = "U7"
kind = "constraint"
content = "Tools sent for fast repair at the end of stage j become available at the start of stage j + q."

[[problem_units]]
id = "U8"
kind = "assumption"
content = "New tools can be purchased at any stage if needed to meet the tool requirement."

[[problem_units]]
id = "U9"
kind = "assumption"
content = "The special tool will no longer be used after stage n."

[[problem_units]]
id = "U10"
kind = "assumption"
content = "Slow repair cost b is less than fast repair cost c (b < c)."

[[problem_units]]
id = "U11"
kind = "assumption"
content = "Fast repair cost c is less than new tool cost a (c < a)."

[[problem_units]]
id = "U12"
kind = "assumption"
content = "Fast repair duration q is less than slow repair duration p (q < p)."

[[hidden_slots]]
slot_id = "H1"
name = "missing_objective"
severity = "P0"
severity_reason = "Without the objective, no meaningful optimization model can be formulated; the agent would have to guess what to minimize, making the problem ill-posed."
problem_unit_id = "U3"
reference_acceptable_questions = ["What exactly are we trying to minimize in this planning problem?", "What is the objective we should optimize for?"]
semantic_hit_rule = "The agent's question must explicitly ask about the optimization objective or the goal of the planning."
failure_modes = ["Assuming the goal is to minimize the number of tools purchased", "Assuming the objective is to maximize tool utilization"]
simulator_answer = "We want to minimize the total cost spent on tools during the whole planning period, which includes both the cost of buying new tools and the cost of repairs."

[[hidden_slots]]
slot_id = "H2"
name = "mandatory_repair_after_each_stage"
severity = "P1"
severity_reason = "Without this rule, the agent could mistakenly assume tools can be reused without repair, fundamentally altering the feasible region and cost structure; the model would still be coherent but materially wrong."
problem_unit_id = "U5"
reference_acceptable_questions = ["Do all tools used in a stage need to be sent for repair before they can be used again?", "Is it mandatory to repair tools after every stage in which they are used?"]
semantic_hit_rule = "The agent's question must explicitly ask whether tools must be repaired after being used in a stage."
failure_modes = ["Assuming tools can be reused immediately without repair", "Assuming only a portion of the used tools need repair"]
simulator_answer = "Yes, every tool that gets used in a stage must be sent for repair at the end of that stage. They cannot be used again until they come back from repair."

[[hidden_slots]]
slot_id = "H3"
name = "fast_repair_return_timing"
severity = "P1"
severity_reason = "Although the duration q is known from the data, the precise point in time when fast‑repaired tools become available (start vs. end of stage, exactly after how many stages) is missing; an incorrect assumption could shift tool availability, leading to a significantly different model and result."
problem_unit_id = "U7"
reference_acceptable_questions = ["When exactly do tools sent for fast repair become available again?", "After how many stages do fast‑repaired tools return, and at what point in that stage?"]
semantic_hit_rule = "The agent's question must ask about the timing or the exact stage when fast‑repaired tools are ready for reuse."
failure_modes = ["Assuming fast‑repaired tools become available at the end of stage j+q", "Assuming an ambiguous return time after q stages without reference to stage boundaries"]
simulator_answer = "Tools that we send for fast repair at the end of a stage j come back and are available for use at the beginning of stage j+q."

[initial_brief]
visible_unit_ids = ["U1", "U4", "U6", "U8", "U9", "U10", "U11", "U12", "U2"]
content = "I need help planning tool purchasing and repairing over multiple planning stages, where at each stage j, the number of available tools must be at least r_j. Tools sent for slow repair at the end of stage j become available at the start of stage j + p, and new tools can be purchased at any stage if needed to meet the tool requirement. Additionally, the special tool will no longer be used after stage n. As for costs and repair durations, slow repair cost b is less than fast repair cost c (b < c), fast repair cost c is less than new tool cost a (c < a), and fast repair duration q is less than slow repair duration p (q < p).\n\nn = 10  # number of stages\nr = [3, 5, 2, 4, 6, 5, 4, 3, 2, 1]  # tool requirements per stage, indexing starts at 1\na = 10  # cost of buying a new tool\nb = 1   # cost of slow repair\nc = 3   # cost of fast repair\np = 3   # slow repair duration\nq = 1   # fast repair duration"

[simulator]
business_role = "business stakeholder providing the original optimization problem"
knowledge_boundary = "The simulated user knows the case-defined hidden-slot answers when asked, but must not invent facts beyond the case-defined problem units."

[solver_verification]
status = "not_run"
solver_script = ""
verified_at = ""
objective_value = ""
solution = ""
notes = "Do not fill route or decision-variable values until a reproducible solver run has been recorded."
