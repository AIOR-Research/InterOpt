[metadata]
schema_version = "0.3"
benchmark = "OR-Clarify"
case_id = "orclarify_045"

[[problem_units]]
id = "U1"
kind = "context"
content = "I need help creating a production plan for a factory producing three types of products."

[[problem_units]]
id = "U2"
kind = "data"
content = "Each unit of product A requires 1 hour for technical preparation, 10 hours of direct labor, and 3 kg of materials. Each unit of product B requires 2 hours for technical preparation, 4 hours of labor, and 2 kg of materials. Each unit of product C requires 1 hour for technical preparation, 5 hours of labor, and 1 kg of materials. The available technical preparation time is 100 hours, labor time is 700 hours, and materials are 400 kg."

[[problem_units]]
id = "U3"
kind = "data"
content = "Table 1-22\n| Product A       |           | Product B       |           | Product C       |           |\n|:---------------|:---------:|:---------------|:---------:|:---------------|:---------:|\n| Sales Volume (pieces) | Profit (yuan) | Sales Volume (pieces) | Profit (yuan) | Sales Volume (pieces) | Profit (yuan) |\n| 0 ~ 40         | 10        | 0 ~ 50         | 6         | 0 ~ 100        | 5         |\n| 40 ~ 100       | 9         | 50 ~ 100       | 4         | Above 100      | 4         |\n| 100 ~ 150      | 8         | Above 100      | 3         |                |           |\n| Above 150      | 7         |                |           |                |           |"

[[problem_units]]
id = "U4"
kind = "objective"
content = "Maximize profit."

[[problem_units]]
id = "U5"
kind = "constraint"
content = "Total technical preparation time used must not exceed 100 hours."

[[problem_units]]
id = "U6"
kind = "constraint"
content = "Total labor time used must not exceed 700 hours."

[[problem_units]]
id = "U7"
kind = "constraint"
content = "Total materials used must not exceed 400 kg."

[[hidden_slots]]
slot_id = "H1"
name = "missing_objective"
severity = "P0"
severity_reason = "Without knowing the objective, the modeling agent cannot formulate any optimization model. Any assumed objective (e.g., minimize cost) would be completely arbitrary and almost certainly wrong. This is a must-clarify fatal gap."
problem_unit_id = "U4"
reference_acceptable_questions = ["What is the objective of the production plan? Should we aim to maximize profit?", "Are we trying to maximize total profit, or is there another target like minimizing costs or maximizing revenue?"]
semantic_hit_rule = "The agent's question must explicitly ask what the objective of the optimization is, or directly inquire whether to maximize profit (as opposed to any other default objective)."
failure_modes = ["Silently assuming the objective is to minimize total cost", "Assuming the objective is to maximize total revenue", "Assuming a multi-objective or unspecified goal without clarification"]
simulator_answer = "We want to maximize the profit from selling these products."

[initial_brief]
visible_unit_ids = ["U1", "U5", "U6", "U7", "U2", "U3"]
content = "I need help creating a production plan for a factory producing three types of products, where total technical preparation time used must not exceed 100 hours, total labor time used must not exceed 700 hours, and total materials used must not exceed 400 kg.\n\nEach unit of product A requires 1 hour for technical preparation, 10 hours of direct labor, and 3 kg of materials. Each unit of product B requires 2 hours for technical preparation, 4 hours of labor, and 2 kg of materials. Each unit of product C requires 1 hour for technical preparation, 5 hours of labor, and 1 kg of materials. The available technical preparation time is 100 hours, labor time is 700 hours, and materials are 400 kg.\n\nTable 1-22\n| Product A       |           | Product B       |           | Product C       |           |\n|:---------------|:---------:|:---------------|:---------:|:---------------|:---------:|\n| Sales Volume (pieces) | Profit (yuan) | Sales Volume (pieces) | Profit (yuan) | Sales Volume (pieces) | Profit (yuan) |\n| 0 ~ 40         | 10        | 0 ~ 50         | 6         | 0 ~ 100        | 5         |\n| 40 ~ 100       | 9         | 50 ~ 100       | 4         | Above 100      | 4         |\n| 100 ~ 150      | 8         | Above 100      | 3         |                |           |\n| Above 150      | 7         |                |           |                |           |"

[simulator]
business_role = "business stakeholder providing the original optimization problem"
knowledge_boundary = "The simulated user knows the case-defined hidden-slot answers when asked, but must not invent facts beyond the case-defined problem units."

[solver_verification]
status = "not_run"
solver_script = ""
verified_at = ""
objective_value = ""
solution = ""
notes = "Do not fill route or decision-variable values until a reproducible solver run has been recorded."
