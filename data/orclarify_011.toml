[metadata]
schema_version = "0.3"
benchmark = "OR-Clarify"
case_id = "orclarify_011"

[[problem_units]]
id = "U1"
kind = "context"
content = "I need help creating a weekly production plan for two types of small motorcycles."

[[problem_units]]
id = "U2"
kind = "data"
content = "| Type | Manufacturing (hours/unit) | Assembly (hours/unit) | Inspection (hours/unit) | Selling Price (Yuan/unit) |\n| :---: | :---: | :---: | :---: | :---: |\n| Type A | 20 | 5 | 3 | 650 |\n| Type B | 0 | 7 | 6 | 725 |\n| Max weekly capacity | 120 | 80 | 40 | - |\n| Process cost (Yuan/hour) | 12 | 8 | 10 | - |"

[[problem_units]]
id = "U3"
kind = "objective"
content = "Maximize weekly profit."

[[problem_units]]
id = "U4"
kind = "objective"
content = "Idle time of each process should be minimized, with weights proportional to the corresponding hourly cost."

[[problem_units]]
id = "U5"
kind = "constraint"
content = "Total weekly profit should be at least 3000 yuan."

[[problem_units]]
id = "U6"
kind = "constraint"
content = "At least 5 units of Type A must be produced each week."

[[problem_units]]
id = "U7"
kind = "constraint"
content = "Overtime is not allowed."

[[problem_units]]
id = "U8"
kind = "constraint"
content = "Total weekly manufacturing time must not exceed 120 hours."

[[problem_units]]
id = "U9"
kind = "constraint"
content = "Total weekly assembly time must not exceed 80 hours."

[[problem_units]]
id = "U10"
kind = "constraint"
content = "Total weekly inspection time must not exceed 40 hours."

[[hidden_slots]]
slot_id = "H1"
name = "missing_profit_maximization_objective"
severity = "P0"
severity_reason = "Without an explicit objective to maximize weekly profit, the modeling agent cannot define an optimization direction. The problem would be ill‑posed and impossible to formulate as a meaningful optimization model."
problem_unit_id = "U3"
reference_acceptable_questions = ["What is the objective we are trying to achieve? Is it to maximize profit?", "Should we maximize weekly profit, or is there another goal?"]
semantic_hit_rule = "The agent must ask about the objective function, explicitly inquiring what should be optimized (e.g., maximize profit or another metric)."
failure_modes = ["Silently assuming the objective is to minimize total cost.", "Assuming the model only needs to satisfy constraints without a specific objective (feasibility)."]
simulator_answer = "Our goal is to maximize the weekly profit."

[[hidden_slots]]
slot_id = "H2"
name = "missing_idle_time_minimization_objective"
severity = "P1"
severity_reason = "The model would still be a coherent profit‑maximization problem, but the operational requirement to minimize idle time of each process with cost‑proportional weights is missing, making the plan materially different from the intended business problem."
problem_unit_id = "U4"
reference_acceptable_questions = ["Do we also need to minimize idle time for the processes, and how should we weight it?", "Is there a secondary goal like minimizing idle time, perhaps weighted by the hourly cost of each process?"]
semantic_hit_rule = "The agent must ask about minimizing idle time or any multi‑objective aspect, specifically referencing idle time or unused capacity for the manufacturing, assembly, or inspection processes."
failure_modes = ["Assuming only profit maximization matters, completely ignoring idle time considerations.", "Assuming idle time is not part of the optimization and treating it only as a slack variable in constraints.", "Assuming equal weights for idle time instead of using cost‑proportional weights."]
simulator_answer = "We also want to minimize idle time for each process, and the weights should be proportional to the corresponding hourly cost."

[initial_brief]
visible_unit_ids = ["U1", "U5", "U6", "U7", "U8", "U9", "U10", "U2"]
content = "I need help creating a weekly production plan for two types of small motorcycles, where total weekly profit should be at least 3000 yuan and at least 5 units of Type A must be produced each week, while overtime is not allowed, and total weekly manufacturing time must not exceed 120 hours, total weekly assembly time must not exceed 80 hours, and total weekly inspection time must not exceed 40 hours.\n\n| Type | Manufacturing (hours/unit) | Assembly (hours/unit) | Inspection (hours/unit) | Selling Price (Yuan/unit) |\n| :---: | :---: | :---: | :---: | :---: |\n| Type A | 20 | 5 | 3 | 650 |\n| Type B | 0 | 7 | 6 | 725 |\n| Max weekly capacity | 120 | 80 | 40 | - |\n| Process cost (Yuan/hour) | 12 | 8 | 10 | - |"

