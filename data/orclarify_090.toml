[metadata]
schema_version = "0.3"
benchmark = "OR-Clarify"
case_id = "orclarify_090"

[[problem_units]]
id = "U1"
kind = "context"
content = "I need help designing promotional packages to clear out last season's inventory."

[[problem_units]]
id = "U2"
kind = "data"
content = "Available inventory: 200 shirts, 100 pairs of pants."

[[problem_units]]
id = "U3"
kind = "data"
content = "Package A: 1 shirt, 2 pairs of pants, price £30. Package B: 3 shirts, 1 pair of pants, price £50."

[[problem_units]]
id = "U4"
kind = "data"
content = "Minimum desired sales: 20 package A, 10 package B."

[[problem_units]]
id = "U5"
kind = "constraint"
content = "Total shirts used in packages cannot exceed 200."

[[problem_units]]
id = "U6"
kind = "constraint"
content = "Total pants used in packages cannot exceed 100."

[[problem_units]]
id = "U7"
kind = "constraint"
content = "Number of A packages sold must be at least 20."

[[problem_units]]
id = "U8"
kind = "constraint"
content = "Number of B packages sold must be at least 10."

[[problem_units]]
id = "U9"
kind = "objective"
content = "Maximize total revenue from selling packages A and B."

[[hidden_slots]]
slot_id = "H1"
name = "missing_objective"
severity = "P0"
severity_reason = "Without knowing the objective, a modeling agent cannot define the optimization criterion. The entire problem formulation is impossible without specifying what should be maximized."
problem_unit_id = "U9"
reference_acceptable_questions = ["What exactly are we trying to maximize? Is it total revenue, profit, or something else?", "Should we just focus on getting the most money from selling the packages?"]
semantic_hit_rule = "The agent's question must explicitly ask about the optimization goal, mentioning \"revenue\" or \"objective\" or \"maximize\" in the context of what to optimize."
failure_modes = ["Silent assumption that the goal is to maximize profit rather than revenue.", "Incorrectly assuming the objective is to minimize leftover inventory."]
simulator_answer = "The goal is to maximize the total revenue from selling these promotional packages."

[initial_brief]
visible_unit_ids = ["U1", "U5", "U6", "U7", "U8", "U2", "U3", "U4"]
content = "I need help designing promotional packages to clear out last season's inventory. Total shirts used in packages cannot exceed 200, total pants used in packages cannot exceed 100, and the number of A packages sold must be at least 20 while the number of B packages sold must be at least 10.\n\nAvailable inventory: 200 shirts, 100 pairs of pants.\n\nPackage A: 1 shirt, 2 pairs of pants, price £30. Package B: 3 shirts, 1 pair of pants, price £50.\n\nMinimum desired sales: 20 package A, 10 package B."

[simulator]
business_role = "business stakeholder providing the original optimization problem"
knowledge_boundary = "The simulated user knows the case-defined hidden-slot answers when asked, but must not invent facts beyond the case-defined problem units."

[solver_verification]
status = "not_run"
solver_script = ""
verified_at = ""
objective_value = ""
solution = ""
notes = "Do not fill route or decision-variable values until a reproducible solver run has been recorded."
