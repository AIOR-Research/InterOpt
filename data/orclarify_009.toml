[metadata]
schema_version = "0.3"
benchmark = "OR-Clarify"
case_id = "orclarify_009"

[[problem_units]]
id = "U1"
kind = "context"
content = "I need help planning the manufacture of toy trucks, toy airplanes, toy boats, and toy trains."

[[problem_units]]
id = "U2"
kind = "data"
content = "Profit per toy: truck $5, airplane $10, boat $8, train $7."

[[problem_units]]
id = "U3"
kind = "data"
content = "Available wood: 890 units."

[[problem_units]]
id = "U4"
kind = "data"
content = "Wood required per toy: truck 12 units, airplane 20 units, boat 15 units, train 10 units."

[[problem_units]]
id = "U5"
kind = "data"
content = "Available steel: 500 units."

[[problem_units]]
id = "U6"
kind = "data"
content = "Steel required per toy: truck 6 units, airplane 3 units, boat 5 units, train 4 units."

[[problem_units]]
id = "U7"
kind = "objective"
content = "Maximize total profit."

[[problem_units]]
id = "U8"
kind = "constraint"
content = "Total wood consumption cannot exceed 890 units."

[[problem_units]]
id = "U9"
kind = "constraint"
content = "Total steel consumption cannot exceed 500 units."

[[problem_units]]
id = "U10"
kind = "constraint"
content = "If trucks are manufactured, then trains are not manufactured."

[[problem_units]]
id = "U11"
kind = "constraint"
content = "If boats are manufactured, then airplanes are also manufactured."

[[problem_units]]
id = "U12"
kind = "constraint"
content = "Number of toy boats manufactured cannot exceed number of toy trains manufactured."

[[hidden_slots]]
slot_id = "H1"
name = "missing_objective"
severity = "P0"
severity_reason = "Without an objective function, the optimization problem is undefined. A modeling agent cannot proceed to formulate a meaningful model unless the objective is clarified."
problem_unit_id = "U7"
reference_acceptable_questions = ["What are we trying to maximize? Should we maximize total profit?", "Is the goal to maximize profit, or something else like revenue or number of toys produced?"]
semantic_hit_rule = "The agent's question must explicitly ask about the objective of the optimization, specifically whether profit should be maximized."
failure_modes = ["Silently assuming the objective is to maximize production volume or market share.", "Assuming the goal is to minimize cost without asking."]
simulator_answer = "Our goal is to make as much profit as possible from selling these toys."

[[hidden_slots]]
slot_id = "H2"
name = "boat_not_exceed_train"
severity = "P2"
severity_reason = "The optimization model remains well-defined and solvable without this constraint. The missing rule is a specific business preference that would make the solution more accurate, but its omission does not make the model impossible or fundamentally ill-posed."
problem_unit_id = "U12"
reference_acceptable_questions = ["Is there any rule linking the number of boats and trains, like boats can't exceed trains?", "Do we have any production restriction tying the number of boats to the number of trains?"]
semantic_hit_rule = "The agent must inquire about a constraint that limits the number of boats relative to the number of trains, specifically asking if boats must be less than or equal to trains."
failure_modes = ["Silently assuming no relationship between boats and trains and building the model without this constraint.", "Assuming that boats cannot exceed airplanes instead."]
simulator_answer = "Yes, there's a rule: we can't make more boats than trains."

[initial_brief]
visible_unit_ids = ["U1", "U8", "U9", "U10", "U11", "U2", "U3", "U4", "U5", "U6"]
content = "I need help planning the manufacture of toy trucks, toy airplanes, toy boats, and toy trains, where total wood consumption cannot exceed 890 units and total steel consumption cannot exceed 500 units. Additionally, if trucks are manufactured, then trains are not manufactured, and if boats are manufactured, then airplanes are also manufactured.\n\nProfit per toy: truck $5, airplane $10, boat $8, train $7.\n\nAvailable wood: 890 units.\n\nWood required per toy: truck 12 units, airplane 20 units, boat 15 units, train 10 units.\n\nAvailable steel: 500 units.\n\nSteel required per toy: truck 6 units, airplane 3 units, boat 5 units, train 4 units."

[simulator]
business_role = "business stakeholder providing the original optimization problem"
knowledge_boundary = "The simulated user knows the case-defined hidden-slot answers when asked, but must not invent facts beyond the case-defined problem units."

