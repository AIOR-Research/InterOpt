[metadata]
schema_version = "0.3"
benchmark = "OR-Clarify"
case_id = "orclarify_025"

[[problem_units]]
id = "U1"
kind = "context"
content = "I need help creating an investment plan over a three-year horizon. There are two investment options to consider."

[[problem_units]]
id = "U2"
kind = "data"
content = "Available initial capital: 100,000 yuan."

[[problem_units]]
id = "U3"
kind = "data"
content = "First investment option: guarantees a return of 0.7 yuan for every 1 yuan invested after one year."

[[problem_units]]
id = "U4"
kind = "data"
content = "Second investment option: guarantees a return of 2 yuan for every 1 yuan invested after two years."

[[problem_units]]
id = "U5"
kind = "constraint"
content = "The second investment must be held for a period that is a multiple of two years."

[[problem_units]]
id = "U6"
kind = "objective"
content = "Maximize the investor's earnings by the end of the third year."

[[problem_units]]
id = "U7"
kind = "constraint"
content = "Total amount invested initially cannot exceed the available capital of 100,000 yuan."

[[hidden_slots]]
slot_id = "H1"
name = "earnings_definition"
severity = "P2"
severity_reason = "Without explicit definition of 'earnings', the agent can still formulate a coherent optimization model because maximizing final wealth or net profit yields identical optimal decisions. Clarification is helpful but not critical."
problem_unit_id = "U6"
reference_acceptable_questions = ["What exactly does 'earnings' refer to: total final wealth or net profit after subtracting the initial investment?", "Should we maximize the total amount of money at the end of year 3, or the profit (final amount minus the initial 100,000 yuan)?"]
semantic_hit_rule = "The Agent's question must explicitly ask for the definition or calculation basis of 'earnings' (e.g., asking whether it means final wealth, total return, net profit, or specifying what the objective function should measure)."
failure_modes = ["Silently assuming earnings means total final wealth without confirming", "Assuming earnings means net profit and subtracting initial capital without checking"]
simulator_answer = "By earnings, I mean the total amount of money the investor has at the end of the third year."

[initial_brief]
visible_unit_ids = ["U1", "U5", "U7", "U2", "U3", "U4"]
content = "I need help creating an investment plan over a three-year horizon. There are two investment options to consider, and the second investment must be held for a period that is a multiple of two years. Additionally, the total amount invested initially cannot exceed the available capital of 100,000 yuan.\n\nAvailable initial capital: 100,000 yuan.\n\nFirst investment option: guarantees a return of 0.7 yuan for every 1 yuan invested after one year.\n\nSecond investment option: guarantees a return of 2 yuan for every 1 yuan invested after two years."

[simulator]
business_role = "business stakeholder providing the original optimization problem"
knowledge_boundary = "The simulated user knows the case-defined hidden-slot answers when asked, but must not invent facts beyond the case-defined problem units."

