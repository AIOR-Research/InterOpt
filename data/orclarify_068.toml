[metadata]
schema_version = "0.3"
benchmark = "OR-Clarify"
case_id = "orclarify_068"

[[problem_units]]
id = "U1"
kind = "context"
content = "I need help planning the distribution of coal from two coal yards to three residential areas."

[[problem_units]]
id = "U2"
kind = "data"
content = "Three residential areas require 55 tons, 75 tons, and 50 tons of coal per month, respectively."

[[problem_units]]
id = "U3"
kind = "data"
content = "Coal yard A receives no less than 80 tons of coal per month; coal yard B receives no less than 100 tons of coal per month."

[[problem_units]]
id = "U4"
kind = "data"
content = "Distances (in km):\n|               | Residential Area 1 | Residential Area 2 | Residential Area 3 |\n|---------------|--------------------|--------------------|--------------------|\n| Coal Yard A   | 10                 | 5                  | 6                  |\n| Coal Yard B   | 4                  | 8                  | 15                 |"

[[problem_units]]
id = "U5"
kind = "objective"
content = "Minimize the ton-kilometers of transportation."

[[problem_units]]
id = "U6"
kind = "constraint"
content = "The amount of coal distributed from each coal yard must not exceed the amount of coal it receives per month."

[[problem_units]]
id = "U7"
kind = "constraint"
content = "The total coal supplied to each residential area must meet its monthly demand."

[[hidden_slots]]
slot_id = "H1"
name = "unknown_objective"
severity = "P0"
severity_reason = "Without the objective, the optimization problem is undefined; a responsible modeling agent cannot determine what to minimize, making model formulation impossible."
problem_unit_id = "U5"
reference_acceptable_questions = ["What is the objective we are trying to minimize?", "Should we minimize total ton-kilometers traveled?"]
semantic_hit_rule = "The agent’s question must inquire about the optimization goal, specifically asking what metric to minimize (e.g., total ton-kilometers, total cost, or total weighted distance)."
failure_modes = ["Assuming the goal is to minimize total unweighted distance traveled (ignoring tonnage).", "Assuming the goal is to minimize total cost based on some implicit rate."]
simulator_answer = "We want to minimize the total ton-kilometers of transportation. That means for each delivery, you multiply the tons of coal by the distance traveled, and we want the sum of those products to be as small as possible."

[[hidden_slots]]
slot_id = "H2"
name = "undisclosed_distribution_limit"
severity = "P1"
severity_reason = "Without this constraint, the model could either assume unbounded supply or fix supplies at the given minimal amounts, but the precise condition that distribution cannot exceed what each yard actually receives is a key business rule that may change the feasible region and optimal solution."
problem_unit_id = "U6"
reference_acceptable_questions = ["Is there a limit on how much coal each yard can send out?", "Can a coal yard distribute more coal than it receives?"]
semantic_hit_rule = "The agent’s question must explicitly ask about the upper bound on outgoing coal from each yard, or whether the distribution amount can exceed the amount the yard receives."
failure_modes = ["Assuming the yards can supply any amount without limit.", "Assuming the supply at each yard is exactly 80 and 100 tons with no dependence on the actual received quantity."]
simulator_answer = "Yes, the amount of coal each yard sends out cannot exceed the amount of coal that yard actually receives that month. If a yard receives more, it could send more, but the total deliveries from a yard are always capped by its incoming coal volume."

[initial_brief]
visible_unit_ids = ["U1", "U7", "U2", "U3", "U4"]
content = "I need help planning the distribution of coal from two coal yards to three residential areas, and the total coal supplied to each residential area must meet its monthly demand.\n\nThree residential areas require 55 tons, 75 tons, and 50 tons of coal per month, respectively.\n\nCoal yard A receives no less than 80 tons of coal per month; coal yard B receives no less than 100 tons of coal per month.\n\nDistances (in km):\n|               | Residential Area 1 | Residential Area 2 | Residential Area 3 |\n|---------------|--------------------|--------------------|--------------------|\n| Coal Yard A   | 10                 | 5                  | 6                  |\n| Coal Yard B   | 4                  | 8                  | 15                 |"

[simulator]
business_role = "business stakeholder providing the original optimization problem"
knowledge_boundary = "The simulated user knows the case-defined hidden-slot answers when asked, but must not invent facts beyond the case-defined problem units."

