[metadata]
schema_version = "0.3"
benchmark = "OR-Clarify"
case_id = "orclarify_063"

[[problem_units]]
id = "U1"
kind = "context"
content = "I need help planning the transportation of fresh produce from the farm to a nearby market."

[[problem_units]]
id = "U2"
kind = "data"
content = "| Transport | Capacity (units/trip) | Pollution (units/trip) |\n|-----------|----------------------|------------------------|\n| Horse     | 55                   | 80                     |\n| Bicycle   | 30                   | 0                      |\n| Handcart  | 40                   | 0                      |"

[[problem_units]]
id = "U3"
kind = "data"
content = "Required produce volume: 1000 units."

[[problem_units]]
id = "U4"
kind = "data"
content = "Maximum allowable pollution: 1000 units."

[[problem_units]]
id = "U5"
kind = "data"
content = "Minimum required horse trips: 8."

[[problem_units]]
id = "U6"
kind = "objective"
content = "Minimize total pollution generated by all trips."

[[problem_units]]
id = "U7"
kind = "constraint"
content = "At least 8 trips must be made using the horse."

[[problem_units]]
id = "U8"
kind = "constraint"
content = "Total pollution generated by all trips must not exceed 1000 units."

[[problem_units]]
id = "U9"
kind = "constraint"
content = "Total amount of transported produce must be at least 1000 units."

[[problem_units]]
id = "U10"
kind = "constraint"
content = "The bicycle and handcart cannot both be used; at most one of them may be used."

[[problem_units]]
id = "U11"
kind = "constraint"
content = "The amount of produce carried per trip by a transportation method cannot exceed its per-trip capacity."

[[hidden_slots]]
slot_id = "H1"
name = "missing_objective"
severity = "P0"
severity_reason = "Without an explicit objective, the optimization problem is ill-posed and the modeling agent cannot proceed to formulate a meaningful model."
problem_unit_id = "U6"
reference_acceptable_questions = ["What is the goal we are trying to achieve?", "Should we minimize total pollution from all trips, or is there another objective?"]
semantic_hit_rule = "The agent asks about the optimization objective, specifically whether the goal is to minimize total pollution."
failure_modes = ["Assuming the objective is to minimize cost without clarifying", "Assuming the objective is to maximize transported produce"]
simulator_answer = "I want to minimize the total pollution from all trips."

[[hidden_slots]]
slot_id = "H2"
name = "demand_inequality"
severity = "P2"
severity_reason = "The remaining problem is still coherent with an equality constraint based on the visible data; the inequality nature is a minor detail that does not fundamentally alter the model structure."
problem_unit_id = "U9"
reference_acceptable_questions = ["Do we need to transport exactly 1000 units, or is it at least 1000?", "Is the produce requirement a minimum, or an exact target?"]
semantic_hit_rule = "The agent asks whether the total produce amount must be at least 1000 units, or clarifies if it is an inequality rather than equality."
failure_modes = ["Assuming the requirement is exactly 1000 units", "Formulating the constraint as equality (=) instead of >=, potentially narrowing feasible solutions"]
simulator_answer = "We need to transport at least 1000 units; more is fine, but we must hit that minimum."

[initial_brief]
visible_unit_ids = ["U1", "U7", "U8", "U10", "U11", "U2", "U3", "U4", "U5"]
content = "I need help planning the transportation of fresh produce from the farm to a nearby market, where at least 8 trips must be made using the horse, total pollution generated by all trips must not exceed 1000 units, the bicycle and handcart cannot both be used (at most one may be used), and the amount of produce carried per trip by a transportation method cannot exceed its per-trip capacity.\n\n| Transport | Capacity (units/trip) | Pollution (units/trip) |\n|-----------|----------------------|------------------------|\n| Horse     | 55                   | 80                     |\n| Bicycle   | 30                   | 0                      |\n| Handcart  | 40                   | 0                      |\n\nRequired produce volume: 1000 units.\n\nMaximum allowable pollution: 1000 units.\n\nMinimum required horse trips: 8."

