[metadata]
schema_version = "0.3"
benchmark = "OR-Clarify"
case_id = "orclarify_092"

[[problem_units]]
id = "U1"
kind = "context"
content = "I need help organizing transportation for a school trip."

[[problem_units]]
id = "U2"
kind = "data"
content = "Number of students: 400."

[[problem_units]]
id = "U3"
kind = "data"
content = "Available vehicles: 10 buses (50 seats each), 8 minibuses (40 seats each)."

[[problem_units]]
id = "U4"
kind = "data"
content = "Number of available drivers: 9."

[[problem_units]]
id = "U5"
kind = "data"
content = "Rental cost per bus: £800; rental cost per minibus: £600."

[[problem_units]]
id = "U6"
kind = "objective"
content = "Minimize the total rental cost."

[[problem_units]]
id = "U7"
kind = "constraint"
content = "The total seating capacity of the selected buses and minibuses must be at least 400 students."

[[problem_units]]
id = "U8"
kind = "constraint"
content = "At most 10 buses can be used."

[[problem_units]]
id = "U9"
kind = "constraint"
content = "At most 8 minibuses can be used."

[[problem_units]]
id = "U10"
kind = "constraint"
content = "The total number of vehicles (buses and minibuses) used cannot exceed 9."

[[hidden_slots]]
slot_id = "H1"
name = "missing_objective_function"
severity = "P0"
severity_reason = "The problem statement only says 'achieve the lowest cost' but does not explicitly define the objective function. Without knowing it is to minimize total rental cost, the modeling agent cannot build a valid optimization model. This is a fatal gap that makes the model impossible to formulate without clarification."
problem_unit_id = "U6"
reference_acceptable_questions = ["What exactly is the objective we're trying to optimize? Is it minimizing the total rental cost?", "Should the model minimize the total amount of money spent on bus and minibus rentals?"]
semantic_hit_rule = "The Agent's question must directly ask about the objective function, explicitly mentioning minimization of cost or total rental expenditure."
failure_modes = ["Silently assuming the goal is to minimize the number of vehicles used, not the rental cost.", "Silently assuming the lowest cost refers to per-student cost rather than total rental cost."]
simulator_answer = "We want to keep the rental expenses as low as possible, so the goal is to minimize the total cost of renting the buses and minibuses for the trip."

[initial_brief]
visible_unit_ids = ["U1", "U7", "U8", "U9", "U10", "U2", "U3", "U4", "U5"]
content = "I need help organizing transportation for a school trip, subject to the constraints that the total seating capacity of the selected buses and minibuses must be at least 400 students, at most 10 buses and 8 minibuses can be used, and the total number of vehicles (buses and minibuses) cannot exceed 9.\n\nNumber of students: 400.\n\nAvailable vehicles: 10 buses (50 seats each), 8 minibuses (40 seats each).\n\nNumber of available drivers: 9.\n\nRental cost per bus: £800; rental cost per minibus: £600."

[simulator]
business_role = "business stakeholder providing the original optimization problem"
knowledge_boundary = "The simulated user knows the case-defined hidden-slot answers when asked, but must not invent facts beyond the case-defined problem units."

