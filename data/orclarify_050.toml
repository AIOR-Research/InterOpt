[[hidden_slots]]
slot_id = "H1"
name = "purchase_at_month_start"
severity = "P1"
severity_reason = "Without knowing when purchases occur relative to the sales period, the inventory capacity constraint cannot be correctly applied, potentially violating the capacity limit in practice."
problem_unit_id = "U5"
reference_acceptable_questions = ["Do purchases occur at the beginning of each month before any sales are made?", "When exactly during the month do we purchase? At the start or end of the month?"]
semantic_hit_rule = "The Agent's question must explicitly ask about the timing of purchases within the month (e.g., beginning of month, start of month, or when purchases are made)."
failure_modes = ["Assuming purchases are made at the end of the month, which would change inventory peaks and may violate the true capacity limit.", "Assuming the timing of purchases is irrelevant and using an aggregate monthly inventory balance without considering intra-month capacity."]
simulator_answer = "Purchases are made at the beginning of each month."

[initial_brief]
visible_unit_ids = ["U1", "U6", "U7", "U8", "U2", "U3", "U4"]
content = "I need help creating a purchase and sales plan for a product from July to December. The purchase and selling prices for each month are as given in Table 1-21. Inventory in the warehouse must not exceed its capacity, and the objective is to maximize total revenue over the six months.\n\nInitial stock at the end of June: 200 units.\n\nWarehouse capacity limit: 500 units.\n\nTable 1-21:\n| Month | 7  | 8  | 9  | 10 | 11 | 12 |\n|-------|----|----|----|----|----|----|\n| Buy   | 28 | 24 | 25 | 27 | 23 | 23 |\n| Sell  | 29 | 24 | 26 | 28 | 22 | 25 |"

