[metadata]
schema_version = "0.3"
benchmark = "OR-Clarify"
case_id = "orclarify_075"

[[problem_units]]
id = "U1"
kind = "context"
content = "I need help creating a production plan for two products involving chemical reaction processes."

[[problem_units]]
id = "U2"
kind = "data"
content = "Product A requires 2 hours for the first process and 3 hours for the second process per unit. Product B requires 3 hours for the first process and 4 hours for the second process per unit."

[[problem_units]]
id = "U3"
kind = "data"
content = "Available time: first process 16 hours, second process 24 hours."

[[problem_units]]
id = "U4"
kind = "data"
content = "Each unit of product B produced generates 2 units of by-product C at no additional cost."

[[problem_units]]
id = "U5"
kind = "data"
content = "Any unsold by-product C must be disposed of at a cost of 2 yuan per unit."

[[problem_units]]
id = "U6"
kind = "data"
content = "Profit per unit: Product A sold yields 4 yuan, Product B sold yields 10 yuan, By-product C sold yields 3 yuan."

[[problem_units]]
id = "U7"
kind = "constraint"
content = "Total processing time for the first process must not exceed 16 hours."

[[problem_units]]
id = "U8"
kind = "constraint"
content = "Total processing time for the second process must not exceed 24 hours."

[[problem_units]]
id = "U9"
kind = "constraint"
content = "Amount of by-product C generated equals 2 times the amount of product B produced."

[[problem_units]]
id = "U10"
kind = "constraint"
content = "By-product C can be sold up to 5 units."

[[problem_units]]
id = "U11"
kind = "constraint"
content = "Total by-product C generated equals the sum of C sold and C disposed."

[[problem_units]]
id = "U12"
kind = "objective"
content = "Maximize total profit."

[[hidden_slots]]
slot_id = "H1"
name = "byproduct_sales_limit"
severity = "P1"
severity_reason = "Without this constraint, the model would assume unlimited market demand for by-product C, leading to an overoptimistic and likely business-invalid profit maximization. The cap is essential to reflect the real market situation, and the agent should clarify the exact limit before finalizing the model."
problem_unit_id = "U10"
reference_acceptable_questions = ["What is the maximum number of units of by-product C that can be sold?", "Is there a limit on how much by-product C we can sell?"]
semantic_hit_rule = "The agent's question must inquire about the maximum salable quantity of by-product C, or ask whether there is a cap on sales of C, or request the demand limit for C."
failure_modes = ["Assuming that all generated by-product C can be sold, with no upper bound.", "Omitting the sales limit and modeling C sales as unrestricted."]
simulator_answer = "We can sell up to 5 units of by-product C."

[initial_brief]
visible_unit_ids = ["U1", "U7", "U8", "U9", "U11", "U12", "U2", "U3", "U4", "U5", "U6"]
content = "I need help creating a production plan for two products involving chemical reaction processes, where total processing time for the first process must not exceed 16 hours and total processing time for the second process must not exceed 24 hours. The amount of by-product C generated equals 2 times the amount of product B produced, and total by-product C generated equals the sum of C sold and C disposed, while the objective is to maximize total profit.\n\nProduct A requires 2 hours for the first process and 3 hours for the second process per unit. Product B requires 3 hours for the first process and 4 hours for the second process per unit.\n\nAvailable time: first process 16 hours, second process 24 hours.\n\nEach unit of product B produced generates 2 units of by-product C at no additional cost.\n\nAny unsold by-product C must be disposed of at a cost of 2 yuan per unit.\n\nProfit per unit: Product A sold yields 4 yuan, Product B sold yields 10 yuan, By-product C sold yields 3 yuan."

[simulator]
business_role = "business stakeholder providing the original optimization problem"
knowledge_boundary = "The simulated user knows the case-defined hidden-slot answers when asked, but must not invent facts beyond the case-defined problem units."

