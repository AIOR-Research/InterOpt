[metadata]
schema_version = "0.3"
benchmark = "OR-Clarify"
case_id = "orclarify_016"

[[problem_units]]
id = "U1"
kind = "context"
content = "I need help formulating a purchasing and sales plan for a product for the first quarter of next year."

[[problem_units]]
id = "U2"
kind = "data"
content = "Initial stock at the end of this year: 200 units."

[[problem_units]]
id = "U3"
kind = "data"
content = "Maximum warehouse capacity: 500 units."

[[problem_units]]
id = "U4"
kind = "data"
content = "Table 1.3:\n\n| Month | 1 | 2 | 3 |\n| :---: | :---: | :---: | :---: |\n| Purchasing Price (Yuan) | 8 | 6 | 9 |\n| Selling Price (Yuan) | 9 | 8 | 10 |"

[[problem_units]]
id = "U5"
kind = "constraint"
content = "The store purchases goods once at the beginning of each month."

[[problem_units]]
id = "U6"
kind = "constraint"
content = "The warehouse capacity limits the stock to at most 500 units."

[[problem_units]]
id = "U7"
kind = "objective"
content = "Maximize total profit."

[[hidden_slots]]
slot_id = "H1"
name = "purchase_beginning_of_month_timing"
severity = "P1"
severity_reason = "Without this information, the agent cannot correctly set up the inventory balance timing and may assume a different purchase schedule, leading to a materially different model and profit outcome."
problem_unit_id = "U5"
reference_acceptable_questions = ["When exactly do purchases happen within each month? Does the purchase occur at the start of the month so that those goods can be sold in that same month?", "At what point in the month are the goods purchased? Are they available for sale immediately in the same month?"]
semantic_hit_rule = "The agent's question must explicitly ask about the timing of purchases within a month, specifically whether purchases are made at the beginning, and whether the purchased quantity is available for sale in that same month."
failure_modes = ["Silently assumes that purchases occur at the end of the month, so sales in a month can only come from beginning-of-month inventory, not from current purchases.", "Assumes continuous purchasing allowed within the month, ignoring the 'once at the beginning' constraint, potentially mis-specifying inventory balance equations."]
simulator_answer = "We purchase goods once at the beginning of each month."

[initial_brief]
visible_unit_ids = ["U1", "U6", "U7", "U2", "U3", "U4"]
content = "I need help formulating a purchasing and sales plan for a product for the first quarter of next year, where the warehouse capacity limits the stock to at most 500 units, and the objective is to maximize total profit.\n\nInitial stock at the end of this year: 200 units.\n\nMaximum warehouse capacity: 500 units.\n\nTable 1.3:\n\n| Month | 1 | 2 | 3 |\n| :---: | :---: | :---: | :---: |\n| Purchasing Price (Yuan) | 8 | 6 | 9 |\n| Selling Price (Yuan) | 9 | 8 | 10 |"

[simulator]
business_role = "business stakeholder providing the original optimization problem"
knowledge_boundary = "The simulated user knows the case-defined hidden-slot answers when asked, but must not invent facts beyond the case-defined problem units."

