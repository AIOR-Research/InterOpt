[metadata]
schema_version = "0.3"
benchmark = "OR-Clarify"
case_id = "orclarify_021"

[[problem_units]]
id = "U1"
kind = "context"
content = "I need help planning an order of dining tables from three suppliers."

[[problem_units]]
id = "U2"
kind = "data"
content = "Cost per dining table: Supplier A $120, Supplier B $110, Supplier C $100."

[[problem_units]]
id = "U3"
kind = "data"
content = "Each order from Supplier A includes 20 tables; each order from Supplier B includes 15 tables; each order from Supplier C includes 15 tables."

[[problem_units]]
id = "U4"
kind = "objective"
content = "Minimize the total cost of the order."

[[problem_units]]
id = "U5"
kind = "constraint"
content = "The number of orders placed with each supplier must be an integer."

[[problem_units]]
id = "U6"
kind = "constraint"
content = "The total number of tables ordered must be at least 150."

[[problem_units]]
id = "U7"
kind = "constraint"
content = "The total number of tables ordered must be no more than 600."

[[problem_units]]
id = "U8"
kind = "constraint"
content = "If the restaurant decides to order tables from Supplier A, it must also order at least 30 tables from Supplier B."

[[problem_units]]
id = "U9"
kind = "constraint"
content = "If the restaurant decides to order tables from Supplier B, it must also order tables from Supplier C."

[[hidden_slots]]
slot_id = "H1"
name = "missing_objective"
severity = "P0"
severity_reason = "Without an explicit objective, the optimization problem is ill-posed. The modeling agent cannot formulate a meaningful model because there is no goal to optimize, making the problem essentially undefined."
problem_unit_id = "U4"
reference_acceptable_questions = ["What are we trying to optimize? Should we minimize total cost or something else?", "Is the goal to reduce the overall cost of the table order?"]
semantic_hit_rule = "The agent's question must ask about the objective or goal of the optimization, such as whether to minimize cost, maximize something else, or achieve a specific target."
failure_modes = ["Silently assuming the objective is to minimize the number of tables ordered.", "Assuming the objective is to minimize the number of orders placed."]
simulator_answer = "We want to minimize the total cost of the order for the dining tables."

[[hidden_slots]]
slot_id = "H2"
name = "A_requires_min_B_tables"
severity = "P1"
severity_reason = "This is a material business rule that links orders from Supplier A to a minimum quantity from Supplier B. Without it, the model is still coherent but the feasible region and optimal solution will likely be significantly different, missing a key constraint of the real problem."
problem_unit_id = "U8"
reference_acceptable_questions = ["If we order from Supplier A, do we have to order a certain number of tables from Supplier B?", "Is there any requirement that ordering from A forces us to order some minimum amount from B?"]
semantic_hit_rule = "The agent's question must reference the conditional constraint linking an order from Supplier A to a minimum number of tables from Supplier B."
failure_modes = ["Silently ignoring the link and treating orders from A and B as independent.", "Assuming that ordering from A carries no obligation to order from B."]
simulator_answer = "Yes, if we decide to order from Supplier A, we must also order at least 30 tables from Supplier B."

[[hidden_slots]]
slot_id = "H3"
name = "B_requires_C_order"
severity = "P1"
severity_reason = "This conditional rule fundamentally affects the feasible ordering patterns. Omitting it produces a model that is structurally valid but fails to capture a real business restriction, likely yielding a solution that would be invalid in practice."
problem_unit_id = "U9"
reference_acceptable_questions = ["If we place an order with Supplier B, do we also have to place an order with Supplier C?", "Does ordering from B automatically require ordering from C as well?"]
semantic_hit_rule = "The agent's question must explicitly ask about the requirement that any order from Supplier B implies an order from Supplier C."
failure_modes = ["Silently assuming that orders from Supplier B and C are entirely independent.", "Treating Supplier B and C as completely interchangeable without any linked obligation."]
simulator_answer = "Yes, if we place an order with Supplier B, we must also place an order with Supplier C."

[initial_brief]
visible_unit_ids = ["U1", "U5", "U6", "U7", "U2", "U3"]
content = "I need help planning an order of dining tables from three suppliers. The number of orders placed with each supplier must be an integer, and the total number of tables ordered must be at least 150 and no more than 600.\n\nCost per dining table: Supplier A $120, Supplier B $110, Supplier C $100.\n\nEach order from Supplier A includes 20 tables; each order from Supplier B includes 15 tables; each order from Supplier C includes 15 tables."

[simulator]
business_role = "business stakeholder providing the original optimization problem"
knowledge_boundary = "The simulated user knows the case-defined hidden-slot answers when asked, but must not invent facts beyond the case-defined problem units."

[solver_verification]
status = "not_run"
solver_script = ""
verified_at = ""
objective_value = ""
solution = ""
notes = "Do not fill route or decision-variable values until a reproducible solver run has been recorded."
