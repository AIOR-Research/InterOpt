[metadata]
schema_version = "0.3"
benchmark = "OR-Clarify"
case_id = "orclarify_053"

[[problem_units]]
id = "U1"
kind = "context"
content = "I need help deciding which children to take on an upcoming trip."

[[problem_units]]
id = "U2"
kind = "data"
content = "Cost of taking each child: Harry $1200, Hermione $1650, Ron $750, Fred $800, George $800, Ginny $1500."

[[problem_units]]
id = "U3"
kind = "data"
content = "Maximum number of children allowed on the trip: 4."

[[problem_units]]
id = "U4"
kind = "data"
content = "Minimum number of children required: 3."

[[problem_units]]
id = "U5"
kind = "objective"
content = "Minimize the total cost of taking the children."

[[problem_units]]
id = "U6"
kind = "constraint"
content = "They can take up to four children on the upcoming trip."

[[problem_units]]
id = "U7"
kind = "constraint"
content = "Ginny is the youngest, so the Zhang family will definitely take her."

[[problem_units]]
id = "U8"
kind = "constraint"
content = "If the couple takes Harry, they will not take Fred because Harry does not get along with him."

[[problem_units]]
id = "U9"
kind = "constraint"
content = "If the couple takes Harry, they will not take George because Harry does not get along with him."

[[problem_units]]
id = "U10"
kind = "constraint"
content = "If they take George, they must also take Fred."

[[problem_units]]
id = "U11"
kind = "constraint"
content = "If they take George, they must also take Hermione."

[[problem_units]]
id = "U12"
kind = "constraint"
content = "The couple must take at least three children."

[[hidden_slots]]
slot_id = "H1"
name = "harry_fred_conflict_constraint"
severity = "P1"
severity_reason = "Without this constraint, the model would allow both Harry and Fred to be selected, which would violate the family's personal relationship rules. The resulting optimization would still be coherent, but materially inaccurate for the intended problem."
problem_unit_id = "U8"
reference_acceptable_questions = ["Are there any restrictions on which children can travel together?", "Can we take Harry and Fred at the same time?"]
semantic_hit_rule = "The agent's question must explicitly ask about the compatibility or conflict between Harry and Fred, or about pairwise constraints involving these two children."
failure_modes = ["Silently assuming all children can be chosen independently with no interpersonal restrictions.", "Assuming Harry and Fred can both be taken, leading to an invalid combination in the solution."]
simulator_answer = "No, Harry and Fred don't get along, so if we take Harry, we can't take Fred."

[[hidden_slots]]
slot_id = "H2"
name = "harry_george_conflict_constraint"
severity = "P1"
severity_reason = "Omitting this constraint would allow Harry and George to be selected together, which contradicts the stated family dynamics. The model would be coherent but not aligned with the true business requirements."
problem_unit_id = "U9"
reference_acceptable_questions = ["Is there any issue between Harry and George that would prevent them both from going?", "Can Harry and George be chosen together?"]
semantic_hit_rule = "The agent's question must specifically reference the relationship or joint selection of Harry and George, indicating an attempt to uncover a conflict rule."
failure_modes = ["Silently assuming Harry and George can be taken simultaneously.", "Building a model without this exclusion, producing a solution that includes both and violates family preferences."]
simulator_answer = "Right, Harry doesn't get along with George either, so we can't take both of them."

[[hidden_slots]]
slot_id = "H3"
name = "george_implies_hermione_constraint"
severity = "P1"
severity_reason = "This precedence constraint is critical: selecting George forces the inclusion of Hermione. Without it, the agent might optimize a cheaper solution that selects George without Hermione, which is not allowed under the real family rules."
problem_unit_id = "U11"
reference_acceptable_questions = ["Does taking George mean we must also take someone else?", "If we decide to bring George, is Hermione required to come too?"]
semantic_hit_rule = "The agent's question must explicitly ask whether selecting George makes the selection of Hermione mandatory, or whether Hermione must accompany George."
failure_modes = ["Assuming George can be chosen independently without triggering Hermione's inclusion.", "Proposing a solution where George goes but Hermione does not, violating the conditional requirement."]
simulator_answer = "Yes, if we take George, we absolutely have to take Hermione."

[initial_brief]
visible_unit_ids = ["U1", "U5", "U6", "U7", "U10", "U12", "U2", "U3", "U4"]
content = "I need help deciding which children to take on an upcoming trip, where the goal is to minimize the total cost of taking the children. They can take up to four children. Ginny is the youngest, so the Zhang family will definitely take her. Additionally, if they take George, they must also take Fred, and the couple must take at least three children.\n\nCost of taking each child: Harry $1200, Hermione $1650, Ron $750, Fred $800, George $800, Ginny $1500.\n\nMaximum number of children allowed on the trip: 4.\n\nMinimum number of children required: 3."

[simulator]
business_role = "business stakeholder providing the original optimization problem"
knowledge_boundary = "The simulated user knows the case-defined hidden-slot answers when asked, but must not invent facts beyond the case-defined problem units."

