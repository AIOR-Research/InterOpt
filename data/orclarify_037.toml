[metadata]
schema_version = "0.3"
benchmark = "OR-Clarify"
case_id = "orclarify_037"

[[problem_units]]
id = "U1"
kind = "context"
content = "I need help creating a weekly production plan for two types of microcomputers in a factory."

[[problem_units]]
id = "U2"
kind = "data"
content = "| Process | Model A (hours/unit) | Model B (hours/unit) | Maximum Weekly Processing Capacity (hours) |\n| :---: | :---: | :---: | :---: |\n| I | 4 | 6 | 150 |\n| II | 3 | 2 | 70 |\n| Profit ($ per unit) | 300 | 450 |  |"

[[problem_units]]
id = "U3"
kind = "objective"
content = "Maximize total weekly profit."

[[problem_units]]
id = "U4"
kind = "constraint"
content = "Total weekly profit must be at least $10,000."

[[problem_units]]
id = "U5"
kind = "constraint"
content = "At least 10 units of Model A must be produced per week."

[[problem_units]]
id = "U6"
kind = "constraint"
content = "At least 15 units of Model B must be produced per week."

[[problem_units]]
id = "U7"
kind = "constraint"
content = "The weekly production time for Process I must be exactly 150 hours."

[[problem_units]]
id = "U8"
kind = "constraint"
content = "The weekly production time for Process II should be fully utilized, with potential overtime if necessary."

[[problem_units]]
id = "U9"
kind = "assumption"
content = "Both types of microcomputers require the same two production processes."

[[hidden_slots]]
slot_id = "H1"
name = "minimum_profit_target"
severity = "P2"
severity_reason = "The omission leaves the model as a still‑coherent pure profit maximization problem; the lower bound is a business target, not a structural necessity."
problem_unit_id = "U4"
reference_acceptable_questions = ["Is there a requirement that the total weekly profit must be at least $10,000?", "Do we have a minimum profit target of $10,000 per week that must be met?"]
semantic_hit_rule = "The Agent’s question must explicitly ask about a minimum profit requirement or a lower bound of $10,000 on weekly profit."
failure_modes = ["Assuming no minimum profit constraint is required", "Assuming the objective is only to maximize profit without a lower bound"]
simulator_answer = "Yes, our goal is that the total weekly profit should not be less than $10,000."

[[hidden_slots]]
slot_id = "H2"
name = "min_production_model_B"
severity = "P2"
severity_reason = "Without this detail the model remains a valid production planning problem; the minimum quantity for Model B is a contractual preference, not a formulation‑critical gap."
problem_unit_id = "U6"
reference_acceptable_questions = ["Do we have to produce at least 15 units of Model B every week?", "Is there a contractual requirement for a minimum of 15 units of Model B per week?"]
semantic_hit_rule = "The Agent’s question must ask about the minimum production quantity of Model B, specifically at least 15 units per week."
failure_modes = ["Assuming that there is no minimum production requirement for Model B", "Forgetting the contractual obligation for Model B"]
simulator_answer = "Yes, we have a contractual requirement to produce at least 15 units of Model B each week."

[[hidden_slots]]
slot_id = "H3"
name = "exact_process_I_time"
severity = "P2"
severity_reason = "The model still works with a ≤150 capacity constraint; the exact‑150 requirement is an extra operational target, not a fatal modeling defect."
problem_unit_id = "U7"
reference_acceptable_questions = ["Must we use exactly 150 hours of Process I each week, not just up to 150?", "Is it a hard requirement that Process I time equals 150 hours every week?"]
semantic_hit_rule = "The Agent’s question must ask whether Process I time must be exactly 150 hours (i.e., an equality), not merely a capacity upper bound."
failure_modes = ["Assuming that Process I time is limited to at most 150 hours, not exactly 150", "Treating the requirement as a simple capacity constraint"]
simulator_answer = "We need the weekly production time for Process I to be exactly 150 hours, not just up to 150."

[initial_brief]
visible_unit_ids = ["U1", "U3", "U5", "U8", "U9", "U2"]
content = "I need help creating a weekly production plan for two types of microcomputers in a factory, where both types require the same two production processes. The goal is to maximize total weekly profit, subject to at least 10 units of Model A being produced per week and the weekly production time for Process II being fully utilized, with potential overtime if necessary.\n\n| Process | Model A (hours/unit) | Model B (hours/unit) | Maximum Weekly Processing Capacity (hours) |\n| :---: | :---: | :---: | :---: |\n| I | 4 | 6 | 150 |\n| II | 3 | 2 | 70 |\n| Profit ($ per unit) | 300 | 450 |  |"

[simulator]
business_role = "business stakeholder providing the original optimization problem"
knowledge_boundary = "The simulated user knows the case-defined hidden-slot answers when asked, but must not invent facts beyond the case-defined problem units."

